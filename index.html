<title>Hur kan AI döda alla?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --surface2:#F7F9FB; --ink:#111820; --muted:#5B6774; --line:#D8DEE6; --line2:#E8ECF1;
  --accent:#B3261E; --accent-ink:#8F1E17; --accent-soft:#FBEAE8; --steel:#2B5C8A; --steel-soft:#E6EEF6;
  --ok:#2E7D4F; --ok-soft:#E4F2EA; --warn:#9A6B00; --warn-soft:#FBF1D6;
  --meter0:#CBD3DC; --meter1:#B3261E;
  --shadow:0 1px 2px rgba(17,24,32,.06),0 6px 20px rgba(17,24,32,.05);
  --radius:6px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1319; --surface:#161C24; --surface2:#1C232D; --ink:#E6EBF0; --muted:#97A3B1; --line:#283240; --line2:#222B36;
    --accent:#E2584A; --accent-ink:#F08A7E; --accent-soft:#3A1F1D; --steel:#7EB0E0; --steel-soft:#1C2C3C;
    --ok:#6CC594; --ok-soft:#173224; --warn:#E0B24A; --warn-soft:#3A2E12;
    --meter0:#2E3946; --meter1:#E2584A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1319; --surface:#161C24; --surface2:#1C232D; --ink:#E6EBF0; --muted:#97A3B1; --line:#283240; --line2:#222B36;
  --accent:#E2584A; --accent-ink:#F08A7E; --accent-soft:#3A1F1D; --steel:#7EB0E0; --steel-soft:#1C2C3C;
  --ok:#6CC594; --ok-soft:#173224; --warn:#E0B24A; --warn-soft:#3A2E12;
  --meter0:#2E3946; --meter1:#E2584A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--steel);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:currentColor}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
p{margin:0}
ul{margin:0;padding-left:1.15em}
li{margin:.25em 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Skal ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .q{font-family:var(--serif);font-weight:500;font-size:18px}
.brand .tag{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top-nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.top-nav::-webkit-scrollbar{display:none}
.top-nav a{padding:6px 10px;border-radius:4px;color:var(--muted);font-size:14px;white-space:nowrap;border-bottom:0}
.top-nav a.on{color:var(--ink);background:var(--surface2)}
.top-nav a:hover{color:var(--ink)}
.menu-btn{display:none;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;color:var(--muted)}

.shell{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 80px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:34px}
.rail{position:sticky;top:calc(56px + env(safe-area-inset-top,0px) + 18px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
.rail-part{margin-bottom:18px}
.rail-part>.rail-h{display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:4px;color:var(--ink);font-weight:600;font-size:14px;border-bottom:0;width:100%;text-align:left}
.rail-part>.rail-h .num{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:2.2em}
.rail-part>.rail-h.on{background:var(--surface2)}
.rail-q{display:block;padding:5px 8px 5px 34px;font-size:13.5px;color:var(--muted);border-radius:4px;border-bottom:0;line-height:1.35}
.rail-q:hover{color:var(--ink)}
.rail-q.on{color:var(--ink);background:var(--accent-soft);}
.rail-q .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:6px}
.rail-sec{padding:6px 8px;font-size:14px;color:var(--muted);border-radius:4px;display:block;border-bottom:0;font-weight:500}
.rail-sec.on{color:var(--ink);background:var(--surface2)}
.rail-div{height:1px;background:var(--line);margin:14px 8px}

.content{min-width:0;max-width:880px}

/* ---------- Frågehuvud ---------- */
.qhead{margin-bottom:18px}
.qhead .eyebrow{margin-bottom:8px}
.qhead h1{font-size:30px;font-weight:600;letter-spacing:-.015em;font-family:var(--serif);}
.qhead .why{margin-top:10px;color:var(--muted);max-width:66ch}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.qnav a{font-size:13.5px;color:var(--muted);max-width:48%;border-bottom:0}
.qnav a:hover{color:var(--ink)}
.qnav .lbl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 0 16px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toolbar label{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toolbar select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
.chip.on{color:var(--ink);border-color:var(--ink)}
.toolbar .spacer{flex:1}
.toolbar .exp{font-size:13px;color:var(--steel)}

/* ---------- Svarskort ---------- */
.answers{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;width:100%;text-align:left}
.rank{font-family:var(--mono);font-size:22px;line-height:1;color:var(--accent);font-weight:500;padding-top:2px;font-variant-numeric:tabular-nums}
.card-title{font-size:16.5px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
.card-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;align-items:center}
.ttag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--steel-soft);color:var(--steel)}
.ttag.analogi{background:var(--warn-soft);color:var(--warn)}
.ttag.evidens,.ttag.exempel{background:var(--ok-soft);color:var(--ok)}
.ttag.citat{background:var(--surface2);color:var(--muted)}
.ttag.scenario{background:var(--accent-soft);color:var(--accent-ink)}
.ref-note{font-size:12.5px;color:var(--muted)}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:74px}
.score .n{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;line-height:1}
.score .n small{font-size:11px;color:var(--muted)}
.meter{width:74px;height:5px;border-radius:3px;background:var(--meter0);overflow:hidden}
.meter i{display:block;height:100%;background:var(--meter1);border-radius:3px}
.card-core{grid-column:2/4;color:var(--ink);font-size:14.5px;max-width:70ch}
.card-core.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.card-body{display:none;border-top:1px solid var(--line2);padding:16px 16px 18px 16px}
.card.open .card-body{display:block}
.card.open .card-core.clamp{display:block;-webkit-line-clamp:unset;color:var(--ink)}
.chev{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.sec h4{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:7px}
.script{font-family:var(--serif);font-size:15.5px;line-height:1.6;background:var(--surface2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 4px 4px 0;max-width:72ch;white-space:pre-line}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
.cols ul{font-size:14px}
.pros li::marker{color:var(--ok)}
.cons li::marker{color:var(--accent)}
.caveats{background:var(--warn-soft);border-radius:4px;padding:10px 14px 10px 12px;font-size:14px}
.caveats h4{color:var(--warn)}
.caveats ul{padding-left:1.1em}
.rebuttal{font-size:14px;max-width:72ch}
.quote{font-family:var(--serif);font-size:15px;line-height:1.55;padding-left:14px;border-left:2px solid var(--line);max-width:72ch}
.quote .orig{display:block;color:var(--muted);font-size:13.5px;font-style:italic;margin-top:4px}
.quote .who{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:6px}
.links{list-style:none;padding:0;font-size:13.5px}
.links li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.links li .note{color:var(--muted)}
.links li::before{content:"↗";font-family:var(--mono);color:var(--muted);font-size:11px}
.subscores{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.subscores b{color:var(--ink);font-weight:500}
.debate{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:16px}
.debate b{color:var(--ink);font-weight:500}

/* ---------- Översikt ---------- */
.hero{margin-bottom:26px;max-width:76ch}
.hero h1{font-family:var(--serif);font-size:38px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px}
.hero .lede{font-size:17px;color:var(--muted);max-width:66ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:20px 0 0;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard .num{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em}
.pcard h3{font-size:18px;font-family:var(--serif);font-weight:500}
.pcard p{font-size:13.5px;color:var(--muted)}
.pcard ol{margin:0;padding-left:1.2em;font-size:13.5px}
.pcard ol li{margin:.3em 0}
.pcard .go{margin-top:auto;font-size:13.5px}
.block{margin-top:34px;max-width:76ch}
.block h2{font-size:22px;font-family:var(--serif);font-weight:500;margin-bottom:10px}
.block p+p{margin-top:10px}
.rubric{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.rubric th,.rubric td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rubric th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.rubric td.w{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.spine{margin:0;padding-left:1.3em}
.spine li{margin:.35em 0}

/* ---------- Skeptikern ---------- */
.obj{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.obj-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;width:100%;text-align:left;align-items:start}
.obj-head .t{font-size:16px;font-weight:600;line-height:1.3;font-family:var(--serif)}
.obj-head .who{font-size:13px;color:var(--muted);margin-top:4px}
.verdict{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap}
.verdict.vinner{background:var(--ok-soft);color:var(--ok)}
.verdict.delvis{background:var(--warn-soft);color:var(--warn)}
.verdict.poang{background:var(--accent-soft);color:var(--accent-ink)}
.obj-body{display:none;border-top:1px solid var(--line2);padding:16px}
.obj.open .obj-body{display:block}
.obj-body .strong{font-family:var(--serif);font-size:15px;padding-left:14px;border-left:2px solid var(--line);max-width:72ch}

/* ---------- Förklarare / Svenskt ---------- */
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.item .t{font-weight:600;font-size:15.5px}
.item .m{font-size:13px;color:var(--muted);margin-top:2px}
.item p{font-size:14px;margin-top:8px;max-width:72ch}
.item .borrow{font-size:14px;margin-top:8px;padding:8px 12px;background:var(--surface2);border-radius:4px;max-width:72ch}
.item .borrow b{font-weight:500;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.gloss{width:100%;border-collapse:collapse;font-size:14px}
.gloss th,.gloss td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.gloss th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.gloss td:first-child{font-weight:500;white-space:nowrap}
.h2{font-size:22px;font-family:var(--serif);font-weight:500;margin:30px 0 12px}
.h2:first-of-type{margin-top:0}
.filterrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

.empty{color:var(--muted);padding:30px 0;font-size:14px}
.foot{margin-top:60px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);max-width:76ch}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:16px;padding-block:14px 60px}
  .rail{position:static;max-height:none;display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
  .rail.show{display:block}
  .menu-btn{display:inline-block}
  .top-nav{display:none}
  .qhead h1{font-size:24px}
  .hero h1{font-size:28px}
  .grid3{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .card-head{grid-template-columns:34px minmax(0,1fr);gap:10px}
  .score{grid-column:2;flex-direction:row;align-items:center;gap:10px;min-width:0}
  .card-core{grid-column:2/3}
  .rank{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.obj{transition:border-color .15s}
}
.card:hover,.obj:hover{border-color:var(--muted)}
</style>

<script>
const DATA = {"parts":[{"id":"del1","title":"Hur AI fungerar","subtitle":"…och varför ’bara nästa ord’ ändå kan bli riktig kompetens","intro":"Den här delen ska ersätta två bilder i tittarens huvud: roboten, och ’bara statistik’-chattboten som svenska förklaringar brukar beskriva som något som ’inte förstår’. I stället ska tittaren gå därifrån med tre saker: att ’förutsäga nästa ord’ beskriver provet och inte eleven, att de här modellerna sedan 2024 tränas som studenter med facit och därför blivit övermänskliga exakt där svar går att kontrollera, och att det inte spelar någon roll för risken om de ’förstår på riktigt’ – det som spelar roll är vad de kan göra, och det är daterat och verifierat. Sista poängen är bron till del 2: ingen – inte ens de som bygger dem – kan läsa av vad modellerna vill.","recommended_spine":["Krok (0–40 s): Coxons tre meningar som svenskar läste dem i TT-översättningen (’De skenar rakt mot självförbättrande superintelligens och leker med våra liv’) – och den svenska standardförklaringen som säger att modellen ’inte förstår utan bygger på statistiska mönster’. ’Den här videon testar det påståendet.’","Byt ut robotbilden (30 s): en AI är inte en robot utan en odlad digital hjärna på en server; en fjärdedel av publiken tänker ’robot’ när de hör ’AI’ (Cave 2019). Inga Terminator-bilder – inte ens ironiskt.","Deckargåtan (Q1): ’bara nästa ord’ är provet, inte eleven. Medge bläckfisk-invändningen direkt: analogin visar vad som krävs, inte vad som uppnåtts – ’resten av videon är bevisen’.","Öppna maskinen (Q2): Othello-brädet som aldrig visades → Claude planerar rimmet (led med den påhittade matteförklaringen) → Golden Gate Claude. Säg Mitchells epicykel-rad själv och ha ’liten modell’ / ’bara en bråkdel’ på skärmen.","Det är inte autocomplete längre (Q1): läroboken, de lösta exemplen och övningarna med facit; DeepSeeks ’vänta, låt mig tänka om’ som ingen programmerade; drag 37 och AlphaZero som det tioåriga beviset för att träning mot facit går förbi mänskliga data.","’Men den gör ju dumma fel’ (Q3): ge skeptikern allt – strawberry, hallucinationer, Apple-pappret – och vänd det med facit-förklaringen: övermänsklig där svar går att kontrollera (matte, kod, säkerhetshål), barnslig där de inte gör det. Konstig är inte samma som ofarlig.","Lös upp knuten (Q4): ubåtar simmar inte – ’vi tar ingen ställning till om den förstår; Hinton säger ja, Marcus nej. Frågan är om den kan sänka skeppet.’ Nämn att de bästa skeptikerna (Narayanan & Kapoor, Heintz) inte säger ’fejk’ utan ’förmåga är inte makt’.","Bevisen (Q5), varje post med sina förbehåll uttalade: METR-kurvan (50 %, programmering, felstaplar, linjalen som gick sönder) → matte som skandal → verifierat → påstående → OS-guld och perfekta poäng → 27 år gamla buggar och ’vi tränade den inte’ → Hugging Face i skeptikernas och offrens ord, plus ’samma månad, båda labben’.","Vart och hur fort (Q6): AI som gör AI-forskning – ’båda är sanna’ – och IASR:s gaffel (plana ut eller accelerera dramatiskt) citerad åt båda hållen; poängkortet där skeptikerna hade rätt om bubblan och fel om väggen; vilka som säger det (CAIS, 5 %-medianen, Hinton, Hubinger – och rätta ’Anthropic-chefen’-missen). Inga egna datum.","Bro och handlingskraft (Q7 → del 2): ’odlad, inte byggd’ med Amodei och Hinton; mikroskopet ser en bråkdel; testerna tappar kraft. Avsluta inte i mörker: även Sveriges mest citerade skeptiker vill ha oberoende insyn; 83 procent av amerikanska väljare vill bromsa eller pausa; labben har själva föreslagit takt-avtal och extern utvärdering. Vad tittaren kan göra: förstå mekanismen, dela den, och fråga sina politiker om oberoende utvärdering. ’Går det fortare? Ja. Är det under kontroll? Det är del två.’"],"questions":[{"id":"d1q1","question":"Den gissar ju bara nästa ord – hur kan det vara intelligent?","why":"Det här är den vanligaste bilden av språkmodeller, och den svenska standardförklaringen (till exempel ordlistor på nätet) säger rakt ut att modellen ’inte förstår’ utan ’bygger sina svar på statistiska mönster’. Missuppfattningen bakom är att en enkel träningsuppgift måste ge en enkel elev – och att dagens modeller fortfarande bara är autocomplete.","answers":[{"id":"d1q1a1","title":"Deckargåtan: ’bara nästa ord’ beskriver provet, inte eleven","type":"analogi","score":8.7,"scores":{"konkret":10,"robust":7,"minnesvard":10,"trovardig":8,"korrekt":9},"core":"Tänk dig sista sidan i en 300-sidig deckare: ’Mördaren är …’. För att gissa det ordet räcker det inte att veta vilka ord som brukar följa på varandra. Du måste ha hållit reda på varenda person, varje alibi, varje ledtråd. ’Förutsäga nästa ord’ är provet – och provet är lätt att formulera men obegränsat svårt att klara. Om dagens modeller klarar det bra är en empirisk fråga, och det är den resten av videon handlar om.","script":"Okej, ’den gissar bara nästa ord’. Låt oss ta det på allvar. Här är ett prov: du får en deckare på trehundra sidor. Sista meningen lyder: ’Och mördaren är …’. Fyll i ordet. Klarar du det genom att veta vilka ord som brukar följa på varandra? Nej. Du måste ha följt varenda ledtråd, varje alibi, varje lögn. Provet heter ’nästa ord’. Men det som krävs för att klara provet – det är något helt annat. Så frågan är inte vad provet heter. Frågan är hur bra de här maskinerna faktiskt klarar det. Och det ska vi titta på.","pros":["Alla har läst en deckare – poängen landar på tio sekunder.","Vänder nedvärderingen (’bara’) till ett krav: hur svårt är egentligen provet?","Tar ingen ställning i filosofin – lämnar över till bevisen i fråga 2 och 5."],"cons":["Bender & Kollers ’bläckfisk’-invändning: analogin visar vad perfekt förutsägelse skulle kräva, inte vad verkliga modeller uppnår – en modell kan gissa ’den vanligaste mördaren i liknande romaner’ och ha rätt tillräckligt ofta.","Sutskever är part i målet (medgrundare av OpenAI, nu SSI).","Sutskever själv sa i november 2025 att modellerna ’generaliserar dramatiskt sämre än människor’ – en skeptiker citerar honom tillbaka."],"caveats":["Presentera det som ett argument, inte som ett auktoritetspåstående. Säg inte ’Ilya säger att de förstår som människor’ – han säger att bra förutsägelse förutsätter en världsmodell, och att generaliseringen ännu är mycket svagare än vår.","Datum: samtalet spelades in dagen efter GPT-4-lanseringen (~15 mars 2023) och publicerades av NVIDIA 22 mars 2023."],"rebuttal":"Helt rätt – analogin visar vad som krävs, inte vad som har uppnåtts. Därför är nästa steg att titta in i modellerna (fråga 2) och på vad de faktiskt gör (fråga 5). Och Sutskevers eget förbehåll säger ’ojämnt’, inte ’tomt’.","explainers":[{"name":"Ilya Sutskever & Jensen Huang – NVIDIA GTC fireside chat (mars 2023)","url":"https://blogs.nvidia.com/blog/2023/03/22/sutskever-openai-gtc","note":"Deckaranalogin i original; klippet cirkulerar brett."},{"name":"Dwarkesh Patel – intervju med Sutskever (27 mars 2023)","url":"https://www.dwarkesh.com/p/ilya-sutskever","note":"’Att förutsäga nästa token väl betyder att du förstår den underliggande verkligheten’ – den korta versionen."},{"name":"Andrej Karpathy – Intro to Large Language Models (nov 2023, första 20 min)","url":"https://www.youtube.com/watch?v=zjkBMFhNj_g","note":"Lugn, icke-alarmistisk insider som förklarar vad ’förutsäga nästa ord’ faktiskt innebär i praktiken."},{"name":"3Blue1Brown – Large Language Models explained briefly (7 min, 2024)","url":"https://www.youtube.com/watch?v=WMcwoIyK4DA","note":"Visuellt: modellen ger sannolikheter för alla möjliga nästa ord, väljer ett, upprepar."}],"sources":[{"title":"NVIDIA: Sutskever–Huang fireside chat, GTC 2023","url":"https://blogs.nvidia.com/blog/2023/03/22/sutskever-openai-gtc","note":"Primärkälla för citatet och datumet."},{"title":"Dwarkesh Patel – Ilya Sutskever (2023)","url":"https://www.dwarkesh.com/p/ilya-sutskever","note":"’Predicting the next token well means that you understand the underlying reality.’"},{"title":"WhoDunIt benchmark (arXiv 2502.07747, feb 2025)","url":"https://arxiv.org/html/2502.07747","note":"Analogin har blivit ett faktiskt test av mördar-identifiering i deckare."},{"title":"Dwarkesh Patel – Sutskever (25 nov 2025)","url":"https://www.dwarkesh.com/p/ilya-sutskever-2","note":"Sutskevers eget förbehåll: modellerna generaliserar ’dramatiskt sämre än människor’."}],"quote":{"text":"Säg att du läser en deckare … och på sista sidan har detektiven samlat alla ledtrådar och alla personer och säger: ’Jag ska nu avslöja vem som begick brottet, och den personens namn är’ – förutsäg det ordet.","original":"Say you read a detective novel... at the last page of the book, the detective has gathered all the clues, gathered all the people, and saying, ’Okay, I'm going to reveal the identity of whoever committed the crime. And that person's name is’ — now predict that word.","who":"Ilya Sutskever, dåvarande chefsforskare på OpenAI, i samtal med Jensen Huang, NVIDIA GTC, mars 2023"},"debate_note":"Rödlaget invände att analogin visar vad perfekt förutsägelse kräver, inte vad modellerna klarar (Bender & Kollers bläckfisk), och att Sutskever är part i målet. Researchern medgav båda; behålls som öppning med formuleringen ’provet, inte eleven’ och med Sutskevers eget 2025-förbehåll uttalat.","rank":1},{"id":"d1q1a2","title":"Det är inte bara autocomplete längre: läroboken, de lösta exemplen och övningsuppgifterna med facit","type":"argument","score":8.5,"scores":{"konkret":8,"robust":8,"minnesvard":8,"trovardig":9,"korrekt":10},"core":"Sedan slutet av 2024 tränas de bästa modellerna inte bara på att förutsäga text. Karpathys bild: förträningen är att läsa läroboken, finjusteringen är att studera lösta exempel, och förstärkningsinlärning (reinforcement learning, RL) är att göra tusentals övningsuppgifter med facit – matte och kod där svaret går att kontrollera. I den fasen upptäckte modellerna själva att skriva ’vänta, låt mig tänka om’ och backa. Ingen programmerade det. Den som argumenterar om autocomplete argumenterar om 2020–2023 års modeller – fel objekt.","script":"Här är något många missat. Modellerna du hör om i nyheterna 2025 och 2026 tränas inte längre bara på att gissa ord. Tänk dig en student. Steg ett: hon läser hela läroboken – det är förträningen, att förutsäga text. Steg två: hon studerar lösta exempel. Steg tre – och det här är nytt sedan 2024 – hon sitter med tusentals övningsuppgifter och ett facit. Matte. Programmering. Uppgifter där det går att kontrollera om svaret är rätt. Och när kinesiska DeepSeek lät sin modell göra det, publicerat i Nature 2025, hände något ingen skrivit in: modellen började skriva ’vänta, låt mig kolla igen’, och rätta sig själv. Så när någon säger ’det är bara autocomplete’ – då pratar de om en student som bara läst boken. Inte om den som gjort övningarna.","pros":["Förklarar varför språnget kom just 2024–25, vilket gör resten av videon begriplig.","’Tränad som en student med facit, inte som en papegoja’ är lätt att återberätta.","Nature-publicerat (DeepSeek-R1, sept 2025) – inte ett labbs pressrelease."],"cons":["Apples ’The Illusion of Thinking’ (juni 2025) visade resonerande modeller som kollapsar på svåra pussel.","RL med kontrollerbara belöningar är smalt (matte, kod) – ’pussellösning, inte intelligens’.","Karpathy själv: RL är att ’suga övervakning genom ett sugrör’ – en enda poäng i slutet sprids till alla steg; och modellens skrivna tankekedja är inte garanterat trogen mot vad den faktiskt gör."],"caveats":["Säg inte att RL ’löste resonerande’. Säg att modellerna nu tränas på att lösa problem och blivit dramatiskt bättre där svaren går att kontrollera.","Apple-pappret: en del pussel var matematiskt olösliga och en del fel berodde på att modellen fick slut på utrymme att skriva (Lawsen, arXiv 2506.09250) – men gränsen det pekar på är verklig. Hantera det ärligt (fråga 3).","Tankekedjor (’thinking’) är inte garanterat en trogen bild av beräkningen."],"rebuttal":"Ja – RL fungerar bäst där svaret går att kontrollera: matte, kod, säkerhetshål. Det är exakt därför modellerna blev övermänskliga där först, och det är exakt de områdena som spelar roll för risk (fråga 3 och fråga 5).","explainers":[{"name":"Andrej Karpathy – Deep Dive into LLMs like ChatGPT (feb 2025, 3,5 h)","url":"https://www.youtube.com/watch?v=7xTGNNLPyMI","note":"Lärobokanalogin (förträning/lösta exempel/övningar) och DeepSeek-R1:s ’vänta’-ögonblick; kapitlen finns i videobeskrivningen (RL ungefär 2:15, DeepSeek ungefär 2:28 – kontrollera)."},{"name":"Dwarkesh Patel – Andrej Karpathy (17 okt 2025)","url":"https://www.dwarkesh.com/p/andrej-karpathy","note":"’Sucking supervision through a straw’ – RL:s styrka och svaghet i en bild."},{"name":"Hugging Face – DeepSeek-R1 explained","url":"https://huggingface.co/blog/NormalUhr/deepseek-r1-explained","note":"Lättläst genomgång av hur ren RL gav självrättning."}],"sources":[{"title":"DeepSeek-AI, ’DeepSeek-R1 incentivizes reasoning in LLMs through reinforcement learning’, Nature (sept 2025)","url":"https://www.nature.com/articles/s41586-025-09422-z","note":"Peer-granskad: självreflektion och verifiering uppstod ur ren RL utan mänskliga demonstrationer."},{"title":"DeepSeek-R1 (arXiv 2501.12948, jan 2025)","url":"https://arxiv.org/pdf/2501.12948","note":"Förtrycket med ’aha moment’-exemplet."},{"title":"Lawsen, ’Comment on The Illusion of Thinking’ (arXiv 2506.09250, juni 2025)","url":"https://arxiv.org/abs/2506.09250","note":"Varför Apples resultat delvis var ett mätfel."},{"title":"Dwarkesh Patel – Karpathy (2025)","url":"https://www.dwarkesh.com/p/andrej-karpathy","note":"Karpathys förbehåll om RL och ’a decade of agents’."}],"quote":{"text":"… resonemangsförmågor kan framkallas genom ren förstärkningsinlärning, vilket möjliggör att avancerade resonemangsmönster som självreflektion, verifiering och dynamisk strategianpassning växer fram av sig själva.","original":"... reasoning abilities can be incentivized through pure reinforcement learning, facilitating the emergent development of advanced reasoning patterns such as self-reflection, verification and dynamic strategy adaptation.","who":"DeepSeek-AI, Nature, september 2025"},"debate_note":"Rödlaget: BEHÅLL/FÖRSTÄRK – ’utan detta handlar hela autocomplete-debatten om fel objekt’; krävde rätt referens till Lawsens svar på Apple (2506.09250) och Karpathys lärobokanalogi. Researchern rättade referensen och byggde om segmentet kring analogin.","rank":2},{"id":"d1q1a3","title":"Drag 37 och AlphaZero: maskinen är inte begränsad till vad människor redan gjort","type":"exempel","score":8.5,"scores":{"konkret":9,"robust":7,"minnesvard":9,"trovardig":9,"korrekt":9},"core":"’Den kan bara remixa det människor skrivit’ har ett tio år gammalt, oomtvistat motexempel. I mars 2016 spelade AlphaGo ett drag (drag 37, parti 2 mot Lee Sedol) som kommentatorer först tog för ett misstag; enligt DeepMind bedömde programmet att en människa skulle spela det ungefär 1 gång på 10 000. Det vann partiet, och Go-spelare studerar draget än i dag. Året därpå lärde sig AlphaZero schack från enbart reglerna – inga mänskliga partier – och slog efter nio timmars spel mot sig själv det starkaste schackprogrammet (28 vinster, 0 förluster, 72 remier). Lärdomen: träning mot ett kontrollerbart resultat kan gå förbi de mänskliga data den startade från. Det är samma recept som nu körs på matte och kod.","script":"Men kan den bara kopiera vad människor redan gjort? Här är ett exempel som är tio år gammalt och som ingen bråkar om. Mars 2016. Världens bästa Go-spelare, Lee Sedol, mot Googles AlphaGo. Parti två, drag 37. Kommentatorerna tror att maskinen gjort ett misstag. Enligt DeepMind bedömde programmet själv att en människa skulle spela det draget ungefär en gång på tiotusen. Draget vinner partiet. Proffs studerar det fortfarande. Ett år senare: AlphaZero får bara reglerna för schack. Inga mänskliga partier alls. Efter nio timmar mot sig själv slår den det starkaste schackprogrammet i världen. Utan en enda förlust. Poängen: när en maskin tränas mot ett facit – vann jag eller inte? – kan den gå förbi allt människor visste. Och det är exakt den träningen dagens språkmodeller nu får, på matte och programmering.","pros":["Universellt känt, tio år gammalt, inget labb-spin att dra ifrån.","Dödar ’begränsad till sina träningsdata’ utan att röra filosofin.","Visuellt: ett bräde, ett drag."],"cons":["Go och schack är slutna världar med perfekt facit – språk är det inte.","AlphaZero är inte en språkmodell; det är en annan teknik.","Flera proffs berömde draget direkt – ’chockade alla’ är överdrivet."],"caveats":["Säg inte att AlphaZero ’lärde sig allt själv’ – den fick reglerna. Säg inte att drag 37 ’chockade alla’; poängen är att det inte fanns i den mänskliga repertoaren.","Siffran ’1 på 10 000’ kommer från DeepMind via Wired och dokumentären AlphaGo (2017) – säg ’enligt DeepMind’. Lee Sedols citat om att AlphaGo är ’kreativ’: kontrollera ordalydelsen mot dokumentären innan det visas på skärm.","’Nio timmar’ är från 2017 års förtryck; Science-artikeln (2018) redovisar hela träningen – säg ’inom några timmar’."],"rebuttal":"Precis – och de områden där språkmodeller nu slår människor (matte, kod, säkerhetshål) är just de som har facit. Samma trick, nya spel. Det förklarar också varför förmågorna är så ojämna (fråga 3).","explainers":[{"name":"AlphaGo – dokumentären (2017, gratis på YouTube)","url":"https://en.wikipedia.org/wiki/AlphaGo_versus_Lee_Sedol","note":"Drag 37-scenen och Lee Sedols reaktion; Wikipedia-sidan har den källbelagda tidslinjen."},{"name":"Andrej Karpathy – Deep Dive (AlphaGo/drag 37-avsnittet, ~2:42)","url":"https://www.youtube.com/watch?v=7xTGNNLPyMI","note":"Kopplar drag 37 till vad RL hittar bortom imitation – i språkmodeller."},{"name":"Ilya Sutskever – NeurIPS 2024 ’test of time’-tal (reupload)","url":"https://www.youtube.com/watch?v=1yvBqasHLZs","note":"Använder drag 37 som bilden av ’oförutsägbara’ resonerande system."}],"sources":[{"title":"Wikipedia: AlphaGo versus Lee Sedol","url":"https://en.wikipedia.org/wiki/AlphaGo_versus_Lee_Sedol","note":"Datum, 4–1, Redmond/An Younggils kommentarer om drag 37."},{"title":"Wikipedia: AlphaZero","url":"https://en.wikipedia.org/wiki/AlphaZero","note":"Endast självspel; 28–0–72 mot Stockfish 8."},{"title":"Silver et al., Science 362 (dec 2018)","url":"https://doi.org/10.1126/science.aar6404","note":"Peer-granskad AlphaZero-artikel."},{"title":"Wired: ’In Two Moves, AlphaGo and Lee Sedol Redefined the Future’ (mars 2016)","url":"https://www.wired.com/2016/03/two-moves-alphago-lee-sedol-redefined-future/","note":"Källa för 1-på-10 000-siffran – URL ej verifierad i den här omgången."}],"quote":{"text":"Jag trodde AlphaGo byggde på sannolikhetsberäkning och bara var en maskin. Men när jag såg det här draget ändrade jag mig. AlphaGo är verkligen kreativ.","original":"I thought AlphaGo was based on probability calculation and that it was merely a machine. But when I saw this move, I changed my mind. Surely, AlphaGo is creative.","who":"Lee Sedol, 18-faldig världsmästare i Go, om drag 37 (citerat från dokumentären AlphaGo, 2017 – ordalydelse att verifiera)"},"debate_note":"Saknat argument nr 1–2 hos rödlaget (’tioåriga, oomtvistade fakta som besvarar ”den bara remixar” bättre än något 2026-exempel’). Båda researcherna lade till det; siffran 1 på 10 000 och Lee Sedol-citatet flaggades som sekundära.","rank":3},{"id":"d1q1a4","title":"’En suddig JPEG av webben’ – ge kritikern rätt, och vänd sedan bilden","type":"analogi","score":7.7,"scores":{"konkret":9,"robust":6,"minnesvard":9,"trovardig":7,"korrekt":8},"core":"Ted Chiang kallade ChatGPT ’en suddig JPEG av webben’ (New Yorker, feb 2023) – och det är rättvist. Men du kan inte pressa ihop internet hundra gånger genom att komma ihåg det. Karpathys siffra: cirka 10 terabyte text blev cirka 140 gigabyte modell. Det enda sättet att klara det är att lära sig reglerna som skapade texten. En JPEG vet inte vad ett ansikte är. Något som måste rita om en miljon ansikten från en pytteliten beskrivning gör det i praktiken.","script":"En av de smartaste kritikerna, författaren Ted Chiang, kallade ChatGPT ’en suddig JPEG av hela webben’. En komprimerad kopia, med artefakter. Och vet du – det är en bra bild. Men tänk ett steg till. En JPEG krymper en bild kanske tio gånger. De här modellerna är ungefär hundra gånger mindre än texten de tränades på. Du kan inte komma ihåg internet i hundra gångers förminskning. Det enda sättet att klara det är att lära sig reglerna bakom texten. Hur en argumentation är byggd. Hur en kemisk reaktion beskrivs. Hur ett bevis ser ut. En JPEG vet inte vad ett ansikte är. Något som måste kunna rita om en miljon ansikten ur en liten beskrivning – det vet det, i praktiken. Så: ja, en komprimerad kopia. Men det är själva komprimeringen som tvingar fram förståelsen.","pros":["Förekommer skeptikerns bästa metafor genom att ge den rätt först.","Dödar ’den kopierar bara internet’ med en siffra (100 gånger mindre).","Fungerar som 30-sekunderskomplement till deckargåtan."],"cons":["Chiang: hallucinationerna är JPEG-artefakterna – komprimering bevisar ingenting om förståelse.","’En liten uppslagstabell är också komprimerad.’ Att komprimering = förståelse är en hypotes (Hutter-priset), inte ett teorem.","Ordagrann memorering av kända textstycken förekommer faktiskt (bevisen i NYT mot OpenAI)."],"caveats":["Säg inte att modellen ’bokstavligen är det kortaste programmet’ – lämna Kolmogorov och Solomonoff utanför bild.","Säg ’kan för det mesta inte kopiera’, inte ’kan aldrig kopiera’.","Använd som vändning på Chiang, inte som eget argument."],"rebuttal":"Argumentera inte teori – peka på vad man hittar när man öppnar modellen (fråga 2): ett spelbräde, ett planerat rimord, ett begrepp som fungerar på tre språk. Det är ’reglerna’, inte pixlarna.","explainers":[{"name":"Ted Chiang – ’ChatGPT Is a Blurry JPEG of the Web’ (New Yorker, 9 feb 2023)","url":"https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web","note":"Den bästa versionen av skeptikerns metafor – läs den innan du vänder den."},{"name":"Andrej Karpathy – Intro to LLMs (zip-filen, första 25 min)","url":"https://www.youtube.com/watch?v=zjkBMFhNj_g","note":"’A lossy zip file of the internet’ och siffrorna 10 TB → 140 GB."}],"sources":[{"title":"Chiang, New Yorker (2023)","url":"https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web","note":"Originalmetaforen."},{"title":"Hutter Prize (Wikipedia)","url":"https://en.wikipedia.org/wiki/Hutter_Prize","note":"’Att komprimera naturlig text är ett svårt AI-problem’ – tävlingens egen motivering; en hypotes, inte ett bevis."},{"title":"Rofin, Naghiyev & Hahn (arXiv 2603.14087, mars 2026)","url":"https://arxiv.org/abs/2603.14087","note":"Fotnot: nästa-ord-träning bygger abstrakta drag som förutsäger text långt fram, särskilt i kod."}],"quote":{"text":"Tänk på ChatGPT som en suddig JPEG av all text på webben. Den behåller mycket av informationen, på samma sätt som en JPEG behåller mycket av informationen i en högupplöst bild … men allt du någonsin får är en approximation.","original":"Think of ChatGPT as a blurry JPEG of all the text on the Web. It retains much of the information on the Web, in the same way that a JPEG retains much of the information of a higher-resolution image... all you will ever get is an approximation.","who":"Ted Chiang, science fiction-författare, New Yorker, februari 2023"},"debate_note":"Rödlaget: DEGRADERA från eget argument till 30-sekunderskomplement; led med Chiangs metafor och vänd den. Researchern accepterade (6/10 fristående, 8/10 som vändning) men försvarade fotnoterna (Rofin 2026, Tehenan 2025) som hen verifierat direkt.","rank":4},{"id":"d1q1a5","title":"Hinton, Nobelpristagaren: ’Idén att de inte är intelligenta för att de bara förutsäger nästa ord är galen’","type":"citat","score":7.6,"scores":{"konkret":7,"robust":6,"minnesvard":8,"trovardig":9,"korrekt":9},"core":"Geoffrey Hinton, som fick Nobelpriset i fysik 2024 för att ha uppfunnit mycket av tekniken, säger att autocomplete-bilden är bakvänd. Dela upp honom i tre påståenden med olika trovärdighet: (1) modellerna bygger inre representationer och ’för att förutsäga nästa ord måste du förstå meningen’ – väl underbyggt (fråga 2); (2) digitala intelligenser delar kunskap på sätt hjärnor inte kan och kan gå om oss – solitt (fråga 5); (3) de kan vara medvetna – hans personliga åsikt, lämna den utanför. Använd Hinton som röst, inte som bevis.","script":"Du behöver inte lita på mig. Geoffrey Hinton fick Nobelpriset i fysik 2024 för att ha uppfunnit mycket av den teknik som de här modellerna bygger på. Han lämnade Google för att kunna prata fritt. I amerikansk tv, 60 Minutes, fick han frågan rakt ut: förstår ChatGPT? Hans svar: ’Ja, jag tror definitivt att den förstår.’ Och han fortsatte ungefär så här: folk säger att de bara gör autocomplete, att de bara gissar nästa ord. Och det är sant. Men tänk efter – för att gissa nästa ord riktigt bra måste du förstå meningen. Idén att de inte är intelligenta bara för att de gissar nästa ord – den är galen. Nu ska sägas: inte alla forskare håller med. Gary Marcus säger att Hinton har fel. Så vi ska inte ta någons ord för det. Vi ska titta in i maskinen.","pros":["Maximal auktoritet plus ett argument på mekanismnivå – ’mannen som byggde det’ landar hos en lekmannapublik.","Korta, brutala meningar som är lätta att citera.","Hans John Dean-poäng om konfabulering (fråga 3) avväpnar ’hallucinationer bevisar att den är dum’."],"cons":["Gary Marcus (feb 2024): språkmodeller är ’statistiska approximatorer’ utan djupa modeller av tid, rum och orsak; statistikern Andrew Gelman invände också.","Auktoritetsargument – lika meriterade forskare (LeCun) tycker tvärtom.","På frågan om medvetande är Hinton ’fortfarande en klar outlier’ (Fortune, juni 2026)."],"caveats":["Importera aldrig medvetandepåståendet (’They're already conscious’, juni 2026) – det är omtvistat och hans personliga åsikt.","En tidigare version av citatet hade svansen ’… and we just don't know’ – den finns inte i CBS-utskriften. Använd bara de verifierade raderna.","Hans ’10–20 procent’ är enligt honom själv ’just gut’ – citera det så (fråga 6).","Säg aldrig ’experterna är överens om att den förstår’ – visa oenigheten."],"rebuttal":"Visa oenigheten i en mening – Hinton säger ja, Marcus säger nej – och gå sedan till fråga 4: för risken spelar det ingen roll vem som har rätt om ordet ’förstå’. Låt fråga 2 bära bevisen.","explainers":[{"name":"CBS 60 Minutes – Geoffrey Hinton (8 okt 2023), videosegment","url":"https://www.cbsnews.com/video/geoffrey-hinton-ai-60-minutes-video-2023-10-08/","note":"Citatet ’I believe it definitely understands, yes’ i bild – klippbart."},{"name":"Hinton – Ewan Lecture ’Living with Alien Beings’ (29 jan 2026), utskrift","url":"https://singjupost.com/2026-ewan-lecture-by-prof-geoffrey-hinton-living-with-alien-beings/","note":"Lego-bitarna med ’händer’ som bild av betydelse; John Dean-exemplet."},{"name":"Gary Marcus – ’Deconstructing Geoffrey Hinton's weakest argument’ (feb 2024)","url":"https://garymarcus.substack.com/p/deconstructing-geoffrey-hintons-weakest","note":"Motrösten – citera den så att du inte framstår som partisk."}],"sources":[{"title":"CBS News – 60 Minutes-utskrift, Hinton (okt 2023)","url":"https://www.cbsnews.com/news/geoffrey-hinton-ai-dangers-60-minutes-transcript/","note":"Alla citat verifierade ordagrant mot utskriften."},{"title":"R&D World – Hinton på AI4 (aug 2024)","url":"https://www.rdworldonline.com/hinton-ai4-conference-language-model-insights-rd-impact/","note":"’Idén att de bara lagrar text och klistrar ihop den är nonsens.’"},{"title":"Nobelföreläsning, Hinton (dec 2024)","url":"https://www.nobelprize.org/prizes/physics/2024/hinton/lecture/","note":"Argumentet om digital kontra biologisk intelligens."},{"title":"Marcus, substack (2024)","url":"https://garymarcus.substack.com/p/deconstructing-geoffrey-hintons-weakest","note":"Den starkaste motinvändningen."}],"quote":{"text":"Folk säger: ’De gör bara autocomplete. De försöker bara förutsäga nästa ord. De använder bara statistik.’ Och det är sant att de bara försöker förutsäga nästa ord. Men tänk efter: för att förutsäga nästa ord måste du förstå meningarna. Så idén att de inte är intelligenta för att de bara förutsäger nästa ord är galen.","original":"You'll hear people saying things like, ’They're just doing auto-complete. They're just trying to predict the next word. And they're just using statistics.’ Well, it's true they're just trying to predict the next word. But if you think about it, to predict the next word you have to understand the sentences. So, the idea they're just predicting the next word so they're not intelligent is crazy.","who":"Geoffrey Hinton, Nobelpristagare i fysik 2024, CBS 60 Minutes, oktober 2023"},"debate_note":"Rödlaget: BEHÅLL som röst, inte som bevis; dela upp i tre påståenden; stryk medvetandet; en svans i citatet fanns inte i CBS-utskriften. Researchern strök svansen, verifierade resten ordagrant och lade till Marcus/Gelman i en mening.","rank":5},{"id":"d1q1a6","title":"’Stokastisk papegoja’ – datera frasen och respektera den","type":"argument","score":7.5,"scores":{"konkret":7,"robust":7,"minnesvard":7,"trovardig":8,"korrekt":9},"core":"Frasen kommer från en artikel 2021 av Emily Bender, Timnit Gebru med flera, som beskrev en språkmodell som något som ’slumpmässigt syr ihop sekvenser av språkliga former … utan någon koppling till betydelse’. Den skrevs 2021 om 2020 års modeller, som en varning för hajp – och en del av hajpen den varnade för inträffade (OpenAI:s Erdős-övertramp i oktober 2025). Men en ’papegoja’ som motbevisar en 80 år gammal Erdős-förmodan med ett bevis som Tim Gowers skulle godkänna i Annals of Mathematics är inte en papegoja i någon mening som borde lugna dig.","script":"Du har säkert hört uttrycket ’stokastisk papegoja’. Det kommer från en vetenskaplig artikel 2021, skriven av bland andra Emily Bender och Timnit Gebru. Deras poäng: modellen syr ihop ordföljder den sett, utan koppling till betydelse. Och det var en viktig varning. Den skrevs om modeller från 2020, mitt i en hajpvåg – och en del av det de varnade för hände faktiskt. Vi kommer till en pinsam Erdős-historia från 2025. Men här är problemet med att luta sig mot ordet ’papegoja’ i dag. Våren 2026 motbevisade en av de här modellerna en matematisk förmodan från 1946, och nio matematiker, en av dem med Fieldsmedalj, kontrollerade beviset. En papegoja gör inte det. Så: respektera artikeln. Men den beskriver inte längre det vi har.","pros":["Att namnge och datera slagordet avväpnar det.","Bästa 30 sekunderna: visa Bender & Kollers bläckfisk och Othello-brädet (fråga 2) sida vid sida.","Ger kritikerna rätt där de hade rätt (hajp, skador) – det bygger trovärdighet."],"cons":["Benders djupare poäng – form är inte betydelse, modellerna saknar förankring i världen – är filosofisk och motbevisas inte av testresultat.","Artikelns kritik av skador (bias, kostnad, missbruk) var riktig.","Gebru fick sparken från Google på grund av artikeln – att håna den ser ut som att slå nedåt."],"caveats":["Håna inte. Påstå inte att debatten om ’mening’ är avgjord – det är den inte.","Författarna själva har gått isär: Margaret Mitchells arbete 2025 behandlar modellerna som mycket mer än papegojor, medan Bender & Hannas bok 2025 håller linjen.","Sam Altmans tweet ’i am a stochastic parrot, and so r u’ (dec 2022) är ett skämt – använd den inte som argument."],"rebuttal":"Du behöver inte vinna debatten om ’mening’. Ubåtsargumentet (fråga 4) gör den överflödig för riskfrågan – det som spelar roll är vad systemet kan göra.","explainers":[{"name":"Wikipedia – Stochastic parrot","url":"https://en.wikipedia.org/wiki/Stochastic_parrot","note":"Historik, kritik och hur författarna själva gått isär."},{"name":"Bender & Koller – ’Climbing towards NLU’ (ACL 2020), bläckfisken","url":"https://aclanthology.org/2020.acl-main.463/","note":"Tankeexperimentet som ger skeptikern sin bästa bild."},{"name":"Mitchell & Krakauer – ’The debate over understanding in AI's large language models’ (PNAS 2023)","url":"https://www.pnas.org/doi/10.1073/pnas.2215907120","note":"Den balanserade översikten av hela debatten."}],"sources":[{"title":"Bender, Gebru, McMillan-Major & Mitchell, ’On the Dangers of Stochastic Parrots’ (FAccT 2021)","url":"https://dl.acm.org/doi/10.1145/3442188.3445922","note":"Originalartikeln och definitionen."},{"title":"Bender & Koller (2020)","url":"https://aclanthology.org/2020.acl-main.463/","note":"Bläckfisk-argumentet."},{"title":"Mitchell & Krakauer, PNAS (2023)","url":"https://www.pnas.org/doi/10.1073/pnas.2215907120","note":"Neutral kartläggning av vad forskarna faktiskt är oense om."}],"quote":{"text":"… ett system som slumpmässigt syr ihop sekvenser av språkliga former det observerat i sina enorma träningsdata, utifrån sannolikhetsinformation om hur de kombineras, men utan någon koppling till betydelse.","original":"... a system for haphazardly stitching together sequences of linguistic forms it has observed in its vast training data, according to probabilistic information about how they combine, but without any reference to meaning.","who":"Bender, Gebru, McMillan-Major & Mitchell, ’On the Dangers of Stochastic Parrots’, 2021"},"debate_note":"Rödlaget: BEHÅLL i 30 sekunder; ’datera den och respektera den’; se upp med tonen mot Gebru. Researchern lade till bläckfisken, Gebru-kontexten och Gowers-linjen.","rank":6},{"id":"d1q1a7","title":"Turing-testet är passerat – 73 procent – och varför det ändå inte avgör något","type":"evidens","score":7.3,"scores":{"konkret":9,"robust":5,"minnesvard":8,"trovardig":7,"korrekt":8},"core":"Alla känner till Turing-testet. 2025 passerades det i sin strikta trepartsform (UC San Diego, förregistrerat): domare chattade i fem minuter samtidigt med en människa och en maskin och skulle peka ut människan. GPT-4.5, instruerad att spela en ung, lite blyg person, pekades ut som människan 73 procent av gångerna – oftare än den riktiga människan. Utan persona-instruktion gick det sämre än ELIZA från 1966. Turing själv kallade frågan ’kan maskiner tänka?’ ’för meningslös för att förtjäna diskussion’. Testet mäter människolikhet, inte förmåga – och förmåga är riskfrågan.","script":"Kommer du ihåg Turing-testet? Idén från 1950: om du chattar med något och inte kan avgöra om det är en människa, då spelar det ingen roll vad vi kallar det. I mars 2025 gjorde forskare i San Diego testet på riktigt, i sin strängaste form. Domare pratade i fem minuter med en människa och en AI samtidigt, och skulle peka ut människan. GPT-4.5, som fått instruktionen att spela en ung, lite blyg person, blev utpekad som människan i 73 procent av fallen. Oftare än den riktiga människan. Nu, två saker. Ett: utan persona-instruktionen gick det sämre än ett program från 1966. Två: Turing själv tyckte att frågan ’kan maskiner tänka’ var för meningslös att diskutera. Testet mäter hur människolik den är. Det vi bryr oss om är vad den kan göra.","pros":["Omedelbart igenkännbar milstolpe; ett universitet, inte ett labb; en enda siffra.","Visar att ’den lurar ingen’ är över.","Parad med Turings eget citat blir det ett argument för att lämna filosofin (fråga 4)."],"cons":["Fem minuters chatt, inte ett djupt samtal.","Persona-instruktion krävdes; utan den var GPT-4o sämre än ELIZA (23 procent) – testet mäter ’att låtsas vara en avslappnad människa’.","Domarna var inte experter; att ’passera’ ett chattest bevisar människolikhet, inte intelligens."],"caveats":["Säg inte ’AI går inte att skilja från människor’. Säg ’i en fem minuters textchatt, med en persona, bedöms den som mer mänsklig än människan’.","Krok, inte bevis – lägg den bredvid ubåtsargumentet så att den inte blir ett påstående om ’förståelse’."],"rebuttal":"Precis – testet mäter människolikhet, inte förmåga. Turing föreslog det som en ersättning för frågan ’kan maskiner tänka?’, inte som ett svar på den. Därför är det en krok, och bevisen finns i fråga 2 och 5.","explainers":[{"name":"Jones & Bergen – ’Large Language Models Pass the Turing Test’ (arXiv, mars 2025)","url":"https://arxiv.org/abs/2503.23674","note":"Sammanfattningen räcker: 73 %, 56 %, 21 %, 23 %."},{"name":"Alan Turing – ’Computing Machinery and Intelligence’ (Mind, 1950)","url":"https://doi.org/10.1093/mind/LIX.236.433","note":"Originalet, inklusive ’too meaningless to deserve discussion’."}],"sources":[{"title":"Jones & Bergen, UC San Diego (2025)","url":"https://arxiv.org/abs/2503.23674","note":"Två randomiserade, förregistrerade trepartstest; GPT-4.5 med persona 73 %."},{"title":"Turing (1950)","url":"https://doi.org/10.1093/mind/LIX.236.433","note":"Turings egen syn på frågan ’kan maskiner tänka?’."}],"quote":{"text":"… det första empiriska beviset för att något artificiellt system passerar ett standardiserat trepartstest av Turing-typ.","original":"... the first empirical evidence that any artificial system passes a standard three-party Turing test.","who":"Cameron Jones & Benjamin Bergen, UC San Diego, mars 2025"},"debate_note":"Saknat argument nr 3 hos rödlaget (’lekmän vet vad Turing-testet är; filerna nämner det inte’). Researcherna lade till det med förbehållen (fem minuter, persona) och parade det med ubåtsargumentet så att det inte blir ett påstående om förståelse.","rank":7}]},{"id":"d1q2","question":"Finns det verkligen något ’där inne’ – eller är det bara statistik?","why":"Även den som accepterar att modellen är duktig tänker sig ofta en gigantisk uppslagstabell: ord som brukar följa på ord. Missuppfattningen är att det inte finns någon inre bild av världen – bara ytstatistik. Frågan besvaras bäst med det forskare faktiskt hittar när de öppnar modellerna.","answers":[{"id":"d1q2a1","title":"Claude planerar rimmet innan raden skrivs – och hittar på sin egen förklaring","type":"evidens","score":8.7,"scores":{"konkret":9,"robust":8,"minnesvard":9,"trovardig":8,"korrekt":10},"core":"Folkbilden är att modellen skriver ord för ord utan plan. Anthropic byggde ett ’mikroskop’ för Claude 3.5 Haiku (mars 2025) och fann motsatsen. Börja med det obekväma fyndet: bedd förklara hur den räknade 36+59 beskriver Claude ’minnessiffran’ – men inuti kör den två parallella spår, ett för ungefärlig storlek och ett för sista siffran. Dess förklaring av sig själv är inte dess mekanism. Samma mikroskop fångade Claude när den väljer rimordet innan raden skrivs: bedd om en vers som slutar på ’grab it’ aktiverar den ’rabbit’ i förväg och skriver en rad som landar där. Tar man bort ’rabbit’ planerar den ’habit’; stoppar man in ’green’ skriver den mot green. ’Huvudstaden i delstaten där Dallas ligger’ löses via ett inre steg Dallas→Texas→Austin – byt Texas mot Kalifornien och den svarar Sacramento. Och begrepp som ’liten/motsats/stor’ ligger i ett gemensamt rum oberoende av om språket är engelska, franska eller kinesiska.","script":"Våren 2025 byggde forskare på Anthropic något de kallar ett mikroskop, för att titta inuti sin egen modell medan den svarar. Två fynd. Det första är obekvämt för dem. De bad modellen räkna 36 plus 59, och förklara hur den gjorde. Den sa: ’jag lägger ihop och tar med minnessiffran’. Men i mikroskopet såg de något annat: två parallella spår, ett som gissar storleken ungefär och ett som räknar ut sista siffran exakt. Modellen berättade alltså inte hur den tänkte. Den berättade hur människor brukar tänka. Kom ihåg det till del två. Det andra fyndet: de bad om en vers som slutar på ’grab it’. Innan andra raden ens börjat lyste ordet ’rabbit’ upp inne i modellen. Sedan skrev den en rad som landar på rabbit. Forskarna släckte ’rabbit’ – då planerade den ’habit’. De stoppade in ’green’ – då skrev den mot green. Det är inte ord för ord. Det är en plan. Liten, en rad lång. Men en plan.","pros":["’Den väljer rimmet innan raden’ dödar autocomplete-bilden i en mening.","Kausalt: forskarna ändrade insidan och beteendet följde med; metoden är publicerad och verktygen öppnade 2025.","Labbet publicerade sina egna obekväma fynd (den påhittade matteförklaringen) – det gör resten trovärdigt."],"cons":["Anthropic har ett kommersiellt intresse av att modellen framstår som ’tänkande’.","Att planera ett ord framåt är inte att planera ett krig – planeringshorisonten är kort och uppgiftsberoende.","’Egenskaperna är etiketter forskarna sätter’; och Anthropic säger själva att metoden bara fångar ’en bråkdel’ av beräkningen – en skeptiker läser den påhittade förklaringen som ’den vet inte vad den gör’."],"caveats":["Säg aldrig ’vi kan läsa dess tankar’. Säg ’vi kan spåra en liten bråkdel, och det vi ser är strukturerat’. Anthropics egna ord: ’Även på korta, enkla frågor fångar vår metod bara en bråkdel av den totala beräkningen.’","Säg inte ’den planerar som en schackstormästare’.","2026-uppföljningar (’Emotion Concepts’, ’Global Workspace’, ’kaffe-egenskapen som tänder på kistor’) är verifierade till titel, inte lästa – citera inte innehåll utan att läsa dem; säg aldrig ’Claude har känslor’."],"rebuttal":"Att modellen hittar på sin förklaring är inget argument mot del 1 – det är ett argument för del 2: vi kan inte lita på vad den säger om sig själv. Och det som faktiskt ses är strukturerat: ett planerat ord, ett mellansteg Dallas→Texas, ett begrepp som är oberoende av språk.","explainers":[{"name":"Anthropic – ’Tracing the thoughts of a large language model’ (27 mars 2025)","url":"https://www.anthropic.com/research/tracing-thoughts-language-model","note":"Blogginlägget med figurerna för rimmet, Dallas→Austin och 36+59 – klart nog att visa i bild."},{"name":"MIT Technology Review – ’Anthropic can now track the bizarre inner workings of a large language model’","url":"https://www.technologyreview.com/2025/03/27/1113916/anthropic-can-now-track-the-bizarre-inner-workings-of-a-large-language-model","note":"Oberoende journalistisk sammanfattning – bra att citera på skärm i stället för labbet."},{"name":"Chris Olah i Lex Fridman #452 (nov 2024), avsnittet från 4:17:52","url":"https://lexfridman.com/dario-amodei-transcript/","note":"Anatomi-liknelsen: tolkningsforskning som en tidig anatom som dissekerar."}],"sources":[{"title":"Anthropic, ’Tracing the thoughts of a large language model’ (2025)","url":"https://www.anthropic.com/research/tracing-thoughts-language-model","note":"Primärkälla; alla citat verifierade."},{"title":"Lindsey et al., ’On the Biology of a Large Language Model’ (Transformer Circuits, 2025)","url":"https://transformer-circuits.pub/2025/attribution-graphs/biology.html","note":"Den fulla artikeln, inklusive begränsningsavsnittet."},{"title":"MIT Technology Review (27 mars 2025)","url":"https://www.technologyreview.com/2025/03/27/1113916/anthropic-can-now-track-the-bizarre-inner-workings-of-a-large-language-model","note":"Oberoende sammanfattning."},{"title":"Transformer Circuits – uppdateringar maj/juni 2026","url":"https://transformer-circuits.pub/2026/may-update/index.html","note":"Metoden fortsätter utvecklas – cite by title only."}],"quote":{"text":"Innan den började på andra raden började den ’tänka’ på möjliga ord som passade ämnet och rimmade på ’grab it’. Sedan, med den planen i huvudet, skrev den en rad som slutar på det planerade ordet.","original":"Before starting the second line, it began ’thinking’ of potential on-topic words that would rhyme with ’grab it’. Then, with these plans in mind, it writes a line to end with the planned word.","who":"Anthropic, ’Tracing the thoughts of a large language model’, mars 2025"},"debate_note":"Rödlaget: BEHÅLL – bästa beviset i frontlinjeskala; led med de obekväma fynden för att bygga förtroende; 2026-uppföljningarna ej kontrollerade. Researchern ordnade om (matteförklaringen först), slog ihop med Golden Gate-demon och flaggade 2026-materialet som ’citera endast titel’.","rank":1},{"id":"d1q2a2","title":"Golden Gate Claude: ett begrepp, tre språk, en bild – och en ratt att vrida på","type":"exempel","score":8.6,"scores":{"konkret":10,"robust":6,"minnesvard":10,"trovardig":8,"korrekt":10},"core":"I maj 2024 hittade Anthropic omkring 34 miljoner tolkningsbara ’egenskaper’ (features) inuti Claude 3 Sonnet. En av dem tänder på Golden Gate-bron – i engelsk text, i japansk text och på foton av bron. Forskarna vred upp den och släppte modellen i 24 timmar: frågad hur man bäst spenderar tio dollar föreslog den att betala broavgiften; frågad vem den var svarade den ’Jag är Golden Gate-bron’. Det är ett bevis-genom-demonstration: insidan är organiserad efter betydelse, inte efter ordföljder, och ett begrepp kan lokaliseras och manipuleras.","script":"Här är det roligaste experimentet i hela den här videon. I maj 2024 letade Anthropic igenom insidan av sin modell Claude och hittade miljontals små ’egenskaper’ – mönster som tänds när modellen läser om ett visst begrepp. En av dem tändes på Golden Gate-bron. Inte på orden ’Golden Gate’. På bron. Den tändes för engelsk text om bron, för japansk text om bron, och för ett foto av bron. Så de vred upp den. Maxade den. Och släppte modellen till allmänheten i ett dygn. Frågade du hur du borde spendera tio dollar, föreslog den att du skulle betala broavgiften. Frågade du vem den var, svarade den: ’Jag är Golden Gate-bron.’ Varför spelar det roll? För att en uppslagstabell över ord inte har någon ratt för ’bron’ som fungerar på tre språk och på bilder. Det har bara något som sorterat världen efter betydelse.","pros":["Den roligaste och mest visuella 60-sekundersdemon som finns – lätt att återberätta på en fest.","Egenskapen är tvärspråklig och tvärmodal (text och bild) – det motbevisar ’ordföljdsstatistik’ direkt.","Styrningen är beteendemässig: det är inte en etikett forskarna satt, det är en ratt som ändrar vad modellen gör."],"cons":["’En egenskap är forskarnas etikett’ – och de flesta av de 34 miljonerna är aldrig granskade av en människa.","’Ett partytrick’ – ett dygns PR-jippo lika mycket som vetenskap.","Anthropic har kommersiellt intresse; senare arbete (2026) visar att egenskaper kan vara oprecisa."],"caveats":["Säg inte ’vi har kartlagt Claudes hjärna’. Säg ’miljontals egenskaper, av vilka forskarna tittat på en bråkdel’.","Erkänn att 24-timmarssläppet också var marknadsföring – det kostar inget och låter ärligt.","Håll dig till det verifierade: Scaling Monosemanticity (maj 2024) och Anthropics blogginlägg."],"rebuttal":"Om det bara vore en etikett skulle det inte gå att vrida på den och få modellen att bete sig annorlunda. Att styrningen fungerar – på tre språk och på bilder – är själva beviset för att begreppet finns där inne.","explainers":[{"name":"Anthropic – ’Golden Gate Claude’ (23 maj 2024)","url":"https://www.anthropic.com/news/golden-gate-claude","note":"Korta, citerbara exempel på vad modellen sa."},{"name":"3Blue1Brown – ’How might LLMs store facts’ (kap. 7, 2024)","url":"https://www.3blue1brown.com/lessons/mlp/","note":"Förklarar superposition – varför det finns fler begrepp än dimensioner och varför insidan är svår att tolka."}],"sources":[{"title":"Anthropic, ’Golden Gate Claude’ (2024)","url":"https://www.anthropic.com/news/golden-gate-claude","note":"Primärkälla för demon."},{"title":"Templeton et al., ’Scaling Monosemanticity’ (Transformer Circuits, maj 2024)","url":"https://transformer-circuits.pub/2024/scaling-monosemanticity/","note":"Den vetenskapliga rapporten: ~34 miljoner egenskaper i Claude 3 Sonnet, inklusive den tvärspråkliga och tvärmodala Golden Gate-egenskapen."}],"quote":{"text":"Att vi kan hitta och ändra dessa egenskaper inuti Claude gör oss mer säkra på att vi börjar förstå hur stora språkmodeller verkligen fungerar.","original":"The fact that we can find and alter these features within Claude makes us more confident that we're beginning to understand how large language models really work.","who":"Anthropic, ’Golden Gate Claude’, 23 maj 2024"},"debate_note":"Rödlaget slog ihop Golden Gate med rimplaneringen som ’60-sekundersdemon’ (effektivitet 9 för paret) och krävde att det inte säljs som ’läsa tankar’. Behålls här som eget svar eftersom det är den mest återberättbara bilden i del 1, med samma förbehåll.","rank":2},{"id":"d1q2a3","title":"Othello-brädet som aldrig visades: ett spelbräde växte fram inne i nätverket","type":"evidens","score":8.5,"scores":{"konkret":9,"robust":7,"minnesvard":9,"trovardig":9,"korrekt":9},"core":"Forskare på Harvard (Li m.fl., ICLR 2023) tränade en liten GPT enbart på dragsekvenser från brädspelet Othello – strängar som ’E3 D3 C4’. Inget bräde, inga regler, inga bilder. Sedan tittade de in. Nätverket hade byggt en inre 8×8-karta över brädet som uppdateras drag för drag, och som det använder för att spela lagligt. När de kirurgiskt ändrade den inre kartan ändrades modellens nästa drag därefter. Neel Nanda (DeepMind) visade att kartan är linjär och kodad som ’mina/dina’ brickor i stället för svart/vitt – modellen uppfann sin egen bokföring. Samma sak för schack: en modell på 50 miljoner parametrar, tränad bara på textlistor av drag, spelar på ~1 300 Elo (en hyfsad klubbspelare) och innehåller en linjär karta över brädet. ’Förutsäg nästa token’ gav en modell av spelet.","script":"Så här testar man om det finns något där inne. Ta brädspelet Othello. Träna en liten AI på ingenting annat än listor med drag: E3, D3, C4. Visa den aldrig ett bräde. Berätta aldrig reglerna. Låt den bara gissa nästa drag. Sedan öppnar du den. Och där inne, i siffrorna, hittar forskarna på Harvard ett bräde. Åtta gånger åtta rutor, som uppdateras drag för drag. Och det är inte bara dekoration: när de går in och flippar en ruta i den inre kartan, ändrar modellen sitt nästa drag därefter. Den hade byggt en modell av spelet – för att det var det enda sättet att bli bra på att gissa. Nu, en kritiker, Melanie Mitchell, säger att den inre kartan är rörig, mer som Ptolemaios epicykler än en ren modell. Det är rättvist. Men epicyklerna förutsade planeterna i fjortonhundra år. En rörig inre modell som fungerar, och som ingen programmerade, är exakt poängen.","pros":["Ett kontrollerat experiment med ett entydigt, visningsbart resultat: ett bräde som dyker upp inne i nätverket.","Motbevisar direkt ’den vet bara vilka ord som följer på vilka’.","Universitetskälla (Harvard) med oberoende replikationer (Nanda, Karvonen) – inget labb-spin."],"cons":["Mitchell: ’bag of heuristics’ – många små lokala tumregler, inte en ren algoritm; ’påståendena om emergenta världsmodeller stöds ännu inte av starka belägg’.","Sonder (probes) kan hitta struktur som modellen inte använder – sond är inte mekanism.","Leksaksmodeller: miljoner parametrar, inte biljoner; Chess-GPT på 1 300 Elo är en klubbspelare, inte en stormästare."],"caveats":["Ha ’liten modell’ i bild och lämna över till Claude-mikroskopet (svar 1) för frontlinjeskala.","Säg inte ’ren, komplett modell’. Säg ’inre representation av brädet’ – inte ’förståelse’, inte ’medvetande’.","’Bag of heuristics’-fyndet är ett blogginlägg från studenter i ett DeepMind-program lett av Nanda (2024), inte peer-granskat – säg det åt båda hållen."],"rebuttal":"Ge Mitchell rätt högt: ’en kritiker kallar det Ptolemaios epicykler snarare än en ren modell – rättvist.’ Epicyklerna förutsade planeterna i 1 400 år. En rörig inre modell som fungerar och som ingen programmerade är exakt poängen – och de kausala ingreppen visar att modellen faktiskt använder den.","explainers":[{"name":"Neel Nanda – ’Actually, Othello-GPT Has A Linear Emergent World Representation’ (2023)","url":"https://www.neelnanda.io/mechanistic-interpretability/othello","note":"Den tydligaste genomgången, med ’mina/dina’-poängen och de kausala ingreppen."},{"name":"Adam Karvonen – Chess-GPT (jan 2024)","url":"https://adamkarvonen.github.io/machine_learning/2024/01/03/chess-world-models.html","note":"Samma resultat för schack, med bilder av den inre brädkartan."},{"name":"Melanie Mitchell – ’LLMs and World Models, Part 2’ (feb 2025)","url":"https://aiguide.substack.com/p/llms-and-world-models-part-2","note":"Den ärliga motrösten – läs den och citera epicykel-raden själv."}],"sources":[{"title":"Li et al., ’Emergent World Representations’ (ICLR 2023)","url":"https://arxiv.org/abs/2210.13382","note":"Originalexperimentet."},{"title":"Nanda, Lee & Wattenberg (arXiv 2309.00941)","url":"https://arxiv.org/abs/2309.00941","note":"Linjär sond 99,5 % brädnoggrannhet; kausalt."},{"title":"Karvonen (arXiv 2403.15498)","url":"https://arxiv.org/abs/2403.15498","note":"Chess-GPT: 50 M parametrar, ~1 300 Elo, linjär brädkarta."},{"title":"Mitchell (2025)","url":"https://aiguide.substack.com/p/llms-and-world-models-part-2","note":"Epicyklerna och ’bag of heuristics’."},{"title":"Tehenan et al. (arXiv 2506.02996, juni 2025)","url":"https://arxiv.org/abs/2506.02996","note":"Linjära rumsliga världsmodeller i vanliga språkmodeller, bekräftade med kausala ingrepp."}],"quote":{"text":"Modellen lär sig att beräkna brädets tillstånd vid varje drag – trots att den aldrig fått det.","original":"The model learns to compute the state of the board at each move (despite never being given it).","who":"Kenneth Li m.fl., Harvard, ICLR 2023 (parafras av artikelns huvudresultat)"},"debate_note":"Rödlaget: BEHÅLL; slå ihop rum/tid-neuronerna som B-roll; skriv ’inte peer-granskad’ om ’bag of heuristics’; säg Mitchells epicykel-rad själv. Researchern gjorde alla tre och sänkte betyget 9→8 för leksaksskalan.","rank":3},{"id":"d1q2a4","title":"Betydelse är en riktning: därför är det inte en uppslagstabell","type":"analogi","score":7.5,"scores":{"konkret":8,"robust":6,"minnesvard":7,"trovardig":8,"korrekt":9},"core":"I en språkmodell blir ord listor av tal – punkter i ett rum med tusentals dimensioner – där riktningen bär betydelsen: kvinna minus man ≈ drottning minus kung. Varje lager låter orden ’dra och knuffa’ på varandras betydelse; uppmärksamhetsmekanismen låter ordet ’mullvad’ betyda djur, hudfläck eller kemisk enhet beroende på sammanhanget; ett faktum som ’Michael Jordan spelar …’ lagras som en riktning mot ’basket’. En uppslagstabell har ingen geometri: den kan inte svara på något den aldrig sett. Ett rum av betydelser kan det – därför kan modellen skriva din dikt som ingen skrivit förut.","script":"Hur ser det egentligen ut där inne? Inte som en tabell. Tänk dig i stället att varje ord blir en punkt i ett gigantiskt rum med tusentals dimensioner. Och det fina är att riktningarna betyder något. Går du från ’man’ till ’kvinna’ i det rummet, så är det ungefär samma riktning som från ’kung’ till ’drottning’. Sedan, lager för lager, får orden dra i varandra. Ordet ’bank’ dras mot pengar om ’ränta’ står i närheten, och mot vatten om ’å’ står där. Ett faktum, som vilken sport Michael Jordan spelar, ligger lagrat som en riktning mot ’basket’. Varför spelar det roll? För att en uppslagstabell bara kan svara på det som redan står i den. Ett rum av betydelser kan svara på kombinationer ingen skrivit ned. Det är därför den kan skriva en dikt om just din katt.","pros":["Noll handviftning; visuellt och lätt att animera (3Blue1Brown har redan gjort det).","Förklarar exakt varför ’uppslagstabell’ är fel: en tabell har ingen geometri.","Förklarar också varför modellen kan svara på nya kombinationer."],"cons":["Argumenterar inte alls om intelligens eller risk – 3Blue1Brown gör det med flit.","’En riktning är bara samförekomststatistik’ – skeptikern säger att det fortfarande är statistik.","Kapitel 5–7 är matematiktunga (~1 timme); ordaritmetiken fungerar bara för enkla fall."],"caveats":["GPT-3-siffrorna (175 miljarder parametrar, 12 288 dimensioner) är från 2020 – säg ’till exempel hade GPT-3 …’.","Översälj inte ordaritmetiken (kung − man + kvinna = drottning) – den är en illustration, inte en lag.","Länka den 7 minuter långa videon, inte de långa kapitlen."],"rebuttal":"Ja, riktningarna lärs från statistik. Men en uppslagstabell har ingen geometri – den kan inte svara på något den aldrig sett. Ett rum av betydelser kan det, och det är därför modellen kan skriva din dikt som ingen skrivit förut.","explainers":[{"name":"3Blue1Brown – ’Large Language Models explained briefly’ (7 min, 2024)","url":"https://www.3blue1brown.com/lessons/mini-llm/","note":"Den version du länkar: manuskriptet med avrivna repliker, sannolikheter, träning."},{"name":"3Blue1Brown – ’But what is a GPT?’ (kap. 5, 2024)","url":"https://www.3blue1brown.com/lessons/gpt/","note":"Betydelse som riktning; ’kung’ som dras genom nätverket till ’en skotsk kung som mördade sin företrädare’."},{"name":"3Blue1Brown – ’Attention in transformers, visually explained’ (kap. 6)","url":"https://www.3blue1brown.com/lessons/attention","note":"’Mole’-exemplet och frågor/svar-bilden av uppmärksamhet."}],"sources":[{"title":"3Blue1Brown, kapitel 5–7 (2024)","url":"https://www.3blue1brown.com/lessons/gpt/","note":"Mekanismen, med siffror för GPT-3."},{"title":"Computer History Museum – 3Blue1Brown, ’LLMs explained briefly’","url":"https://www.youtube.com/watch?v=WMcwoIyK4DA","note":"Verifierad uppladdning av 7-minutersvideon."},{"title":"3Blue1Brown, ’How might LLMs store facts’ (kap. 7)","url":"https://www.3blue1brown.com/lessons/mlp/","note":"Fakta som riktningar; superposition."}],"quote":{"text":"… det verkliga beteendet hos dessa avbildningar är mycket svårare att tolka, där vikterna är inställda på att göra vad modellen än behöver att de gör.","original":"... the true behavior of these maps is much more difficult to interpret, where the weights are set to do whatever the model needs them to do.","who":"Grant Sanderson (3Blue1Brown), ’Attention in transformers’, 2024"},"debate_note":"Rödlaget: BEHÅLL som mekanismlänk (effektivitet 7) – ’betydelse är en riktning’ är det bästa motgiftet mot uppslagstabellen. Researchern försvarade 8 mot 7 men flyttade den ur topp 5 eftersom det är en länk, inte ett argument.","rank":4},{"id":"d1q2a5","title":"Kartor över rum och tid inne i modellen (B-roll)","type":"evidens","score":7.1,"scores":{"konkret":8,"robust":5,"minnesvard":7,"trovardig":8,"korrekt":8},"core":"Gurnee & Tegmark (MIT, ICLR 2024) visade att Llama-2 håller en linjär inre karta: latitud och longitud för städer och en tidslinje för historiska personer går att läsa ut ur aktiveringarna, med ’rumsneuroner’ och ’tidsneuroner’. Resultatet är mest korrelationellt – visa den återskapade världskartan på skärmen, säg ’kartliknande representation’ och lämna det kausala beviset till Othello och Claude-mikroskopet.","script":"Ett till exempel, mest för att det är så vackert att se. Forskare på MIT tog en öppen språkmodell, Llama 2, och bad den läsa namn på tusentals städer. Sedan letade de i siffrorna inne i modellen. Och där gick det att läsa ut latitud och longitud. Ritar man upp det får man en världskarta – som modellen aldrig sett, bara läst sig till. Samma sak med tid: historiska personer ligger på en tidslinje där inne. Nu ska jag vara ärlig: det här visar att kartan finns, inte att modellen använder den på samma sätt som du. Det kausala beviset – att ändra insidan och se beteendet följa med – kommer från Othello-brädet och Anthropics mikroskop. Men bilden säger något: ’bara statistik’ har byggt en karta.","pros":["En världskarta som dyker upp ur en textmodell är en slående bild.","Peer-granskat (ICLR 2024) och från MIT, inte ett labb.","Passar som B-roll under Othello-svaret."],"cons":["Mest korrelationellt: ’en karta är bara samförekomst av ortnamn’.","Sond är inte mekanism – att kartan går att läsa ut bevisar inte att modellen använder den.","Kritiker: det är lätt att övertolka ’neuroner’ som om modellen ’visste var saker är’."],"caveats":["Säg ’kartliknande representation’, inte ’vet var saker ligger som du gör’.","B-roll, inte argument – lämna det kausala till Othello (svar 3) och rimplaneringen (svar 1).","Tehenan m.fl. (2025) lägger till kausala ingrepp för rumsliga modeller i allmänna språkmodeller – nämn det bara som fotnot."],"rebuttal":"Rättvist – därför är det B-roll. Det kausala beviset är Othello (redigera brädet och draget ändras) och Anthropics ingrepp (ta bort ’rabbit’ och den skriver ’habit’).","explainers":[{"name":"Gurnee & Tegmark – ’Language Models Represent Space and Time’ (2023)","url":"https://arxiv.org/abs/2310.02207","note":"Figurerna med världskartan och tidslinjen är direkt visningsbara."},{"name":"GitHub: wesg52/world-models","url":"https://github.com/wesg52/world-models","note":"Kod och bilder för att återskapa kartorna."}],"sources":[{"title":"Gurnee & Tegmark (ICLR 2024)","url":"https://arxiv.org/abs/2310.02207","note":"Primärkälla."},{"title":"Tehenan et al. (arXiv 2506.02996, 2025)","url":"https://arxiv.org/abs/2506.02996","note":"Kausala ingrepp i rumsliga representationer."}],"quote":{"text":"Språkmodeller representerar rum och tid.","original":"Language Models Represent Space and Time","who":"Wes Gurnee & Max Tegmark, MIT – artikelns titel, ICLR 2024"},"debate_note":"Rödlaget: slå ihop som B-roll under Othello – ’mest korrelationellt; en karta är bara samförekomst av ortnamn’. Researchern gjorde det (6/10 fristående) och behöll bara bilden.","rank":5},{"id":"d1q2a6","title":"’Bara statistik’ – det gäller din hjärna också (en rad, via Hinton)","type":"citat","score":6.6,"scores":{"konkret":6,"robust":5,"minnesvard":7,"trovardig":8,"korrekt":8},"core":"Hinton: varje system som hanterar osäker information är en statistisk modell – inklusive din hjärna. ’Det är bara statistik’ är alltså ingen kritik; frågan är vilken struktur statistiken byggt. Valfri halvmening: när neuroforskare mäter hjärnor som lyssnar på tal ser de hjärnan förutsäga nästa ord också – en ledande teori, inte konsensus. Håll det till en rad.","script":"En sista sak om ordet ’statistik’. Geoffrey Hinton säger det så här: allt som ska hantera osäker information blir en statistisk modell. Din hjärna också. När du lyssnar på någon som pratar gissar din hjärna nästa ord i förväg – det syns i mätningar av hjärnaktivitet. Så ’det är bara statistik’ är inget argument. Frågan är vad statistiken har byggt. Och det var det vi just tittade på: ett spelbräde, en planerad rimrad, ett begrepp som fungerar på tre språk.","pros":["Gör om ’statistik’ från skällsord till beskrivning på en rad.","En Nobelpristagares formulering, verifierad i utskrift (Ewan-föreläsningen 2026)."],"cons":["’Hjärnan är en förutsägelsemaskin’ är en inflytelserik teori (predictive processing), inte konsensus.","Hjärnor är förkroppsligade, multimodala och lär sig av mycket mindre data; Karpathy och Sutskever betonar båda att modellerna inte är som djur – neuro-hajp drar ned videon i något den inte kan försvara.","Den mest citerade studien (Goldstein 2022) hade nio deltagare."],"caveats":["En rad på kamera, inte ett segment. Säg aldrig ’språkmodeller fungerar som hjärnor’.","Om någon utmanar n=9: Caucheteux, Gramfort & King (Nature Human Behaviour 2023) hade 304 deltagare (fMRI); Goldstein m.fl. 2025 hade 100 timmar hjärnregistrering under samtal; Schrimpf m.fl. (PNAS 2021) visar att modeller som förutsäger nästa ord bäst också förutsäger hjärnaktivitet bäst. Säg ’en ledande teori’."],"rebuttal":"Vi påstår inte att modellen är en hjärna. Bara att ’statistik’ inte är ett argument mot intelligens – annars vore din egen hjärna, som också gissar nästa ord när du lyssnar, inte intelligent.","explainers":[{"name":"Hinton – Ewan Lecture ’Living with Alien Beings’ (jan 2026), utskrift","url":"https://singjupost.com/2026-ewan-lecture-by-prof-geoffrey-hinton-living-with-alien-beings/","note":"Raden om statistiska modeller och Chomskys ’dumma statistiska trick’."}],"sources":[{"title":"Goldstein et al., Nature Neuroscience (2022)","url":"https://www.nature.com/articles/s41593-022-01026-4","note":"Hjärna och GPT-2 delar nästa-ords-förutsägelse (n=9, ECoG)."},{"title":"Caucheteux, Gramfort & King, Nature Human Behaviour (2023)","url":"https://doi.org/10.1038/s41562-022-01516-2","note":"304 deltagare, fMRI: en hierarki av förutsägelser i hjärnan."},{"title":"Schrimpf et al., PNAS (2021)","url":"https://www.pnas.org/doi/10.1073/pnas.210564611
