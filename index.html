så. Ange aldrig ett eget datum – bara namngivna källors."},{"en":"treacherous turn","sv":"den förrädiska vändningen","note":"Bostroms exakta svenska ordval är obekräftat. Förklara: ”AI:n beter sig väl tills den är stark nog att inte behöva”."},{"en":"corrigibility","sv":"korrigerbarhet (sällsynt); att AI:n låter sig rättas och stängas av","note":"Häggström diskuterar Carlsmith om corrigibility på engelska (blogg nov 2025). Förklara hellre än översätt."},{"en":"kill switch","sv":"nödstopp; avstängningsknapp; dra i nödbromsen","note":"SvD 13 sept 2026 använder ”Dra i nödbromsen” i rubrik. Koppla till självbevarelsedrift: ”varför en AI kan vilja koppla ur nödstoppet”."},{"en":"gradual disempowerment","sv":"gradvis maktförlust; att människor steg för steg tappar inflytandet","note":"Ingen svensk användning hittad; beskriv scenariot i stället för att namnge det."},{"en":"race dynamics","sv":"kapplöpning; AI-kapplöpningen; kapprustning; chicken race","note":"Syre: ”kapprustningen”; Modlitba (TV4): ”chicken race”; Häggström: ”vansinneskapplöpningen mot superintelligens”."},{"en":"pause / moratorium","sv":"paus; moratorium; bromsa; dra i nödbromsen; ett stopp","note":"Nyheter24: ”bromsa”; SvD: ”nödbromsen”; Häggström: ”ett stopp”; PauseAI: ”köpa tid”."},{"en":"AI safety / safety researcher","sv":"AI-säkerhet; säkerhetsforskare","note":"TT om Hubinger: ”säkerhetsforskare”. Skilj från ”IT-säkerhet”."},{"en":"agent / agentic","sv":"AI-agent; agentisk AI; AI som agerar självständigt","note":"SVT juli 2026: ”AI-agent rymde från testmiljö”."},{"en":"sandbox","sv":"testmiljö; sandlåda","note":"SVT: ”testmiljö” (om agenten som rymde). Obs: ”regulatorisk sandlåda” i AI-utredningen betyder något annat (undantag för att testa produkter under tillsyn)."},{"en":"jailbreak","sv":"jailbreak – att lura modellen förbi sina spärrar","note":"Ingen svensk term hittad; behåll engelskan med förklaring."},{"en":"system card","sv":"systemkort (system card) – labbets egen säkerhetsrapport om en modell","note":"Ingen svensk term hittad; Ottsjö i Ny Teknik översätter innehållet snarare än ordet. Nämn alltid att det är labbets egen rapport (Dubhashis invändning)."},{"en":"frontier model","sv":"frontmodell; de mest avancerade modellerna","note":"Ingen svensk användning hittad; ”de mest avancerade modellerna” är tydligast."},{"en":"chain of thought","sv":"tankekedja; modellens resonemang steg för steg","note":"Ingen svensk användning hittad; förklara som ”modellen skriver ut sina tankesteg innan den svarar”."},{"en":"weights","sv":"vikter – modellens parametrar, ”själva modellen” som fil","note":"Ingen svensk debattanvändning hittad; ”vikter” är den tekniska standardöversättningen."},{"en":"compute","sv":"beräkningskraft","note":"AI-kommissionen och svensk press talar om beräkningskraft och ”AI-fabrik”."},{"en":"paperclip maximizer","sv":"gemmaximeraren (om den måste nämnas)","note":"Ingen svensk medieanvändning hittad; Bostroms svenska ordval obekräftat. Använd inte som rubrik – förklara principen med Försäkringskassan eller glädjebetyg i stället."},{"en":"”AI does not hate you, nor does it love you…”","sv":"”AI hatar dig inte, ej heller älskar den dig, men du består av atomer som den kan ha annan användning för.”","note":"Häggströms svenska version av Yudkowsky, GP 15 jan 2026 – citera den, översätt inte själv."},{"en":"utopia if alignment is solved","sv":"”guld och gröna skogar”","note":"Häggström GP jan 2026. Bra för att visa att varnarna inte är teknikfientliga."}]}]},"method":{"lede":"Alla argument, analogier, exempel och bevis som hittats för en videoserie om hur AI skulle kunna döda alla människor – sorterade efter hur effektiva de sannolikt är för en tittare utan förkunskaper. Varje svar har manusförslag, fördelar, nackdelar, det som inte får överdrivas, och källor. Allt är stresstestat i en debattrunda mellan agenter.","agents":"20","rubric_intro":"Varje svar har fått 1–10 på fem kriterier. Vikterna bygger på vad forskning om riskkommunikation säger fungerar (konkreta, daterade exempel slår abstraktioner; trovärdiga budbärare och ärliga förbehåll bygger förtroende; rädsla utan handlingsutrymme slår bakut). Sammanvägningen är en bedömning, inte en mätning – använd den som utgångspunkt, inte facit.","how_to_use":["Välj en del i menyn och bläddra mellan frågorna – de är formulerade som en nyfiken tittare skulle ställa dem. Under varje fråga ligger svaren rankade; det översta är det som bedöms ha störst chans att både övertyga och hålla för granskning.","Fäll ut ett svar för att se manusförslaget (\"Så kan du säga det\"), fördelar och nackdelar, hur du bemöter den vanligaste invändningen, vad du inte får överdriva, vilka som förklarat det bra, och källorna. Raden \"Från debattrundan\" visar vad rödlaget invände och hur det landade.","Sortera om efter robusthet, konkretion eller trovärdighet om du vill optimera för något annat än den sammanvägda effektiviteten. Filtrera på typ (argument, analogi, evidens, exempel, citat, scenario) för att t.ex. bara se det som går att visa på skärm.","Läs \"Skeptikern\" innan du spelar in: där ligger de starkaste invändningarna, det bästa svaret på var och en, och en ärlig markering av var skeptikern faktiskt har en poäng. Att medge de poängerna på kamera är en av de mest effektiva sakerna du kan göra.","Under \"Översikt\" finns en rekommenderad dramaturgi för varje del. Under \"Metod\" finns hela researchmaterialet på engelska, inklusive rödlagens kritik och researcharnas svar."],"footer":"Sammanställt 15 september 2026. Källorna är daterade; det här området rör sig fort, så kontrollera de senaste siffrorna (t.ex. METR:s tidshorisonter och systemkort) innan inspelning.","intro":"Uppdraget var att hitta de absolut bästa argumenten och exemplen, låta dem granskas hårt, och sortera dem efter sannolik effekt. Så här gick det till.","sections":[{"title":"Fas 1: Elva researchagenter, var sitt område","paragraphs":["Elva agenter arbetade parallellt med varsitt område och skrev sina fynd i engelska researchfiler (totalt cirka 130 000 ord): tre för Del 1 (varför nästa-ord-prediktion kan bli intelligens; vad AI faktiskt kan i september 2026 och vart trenden pekar; de bästa befintliga förklararna), tre för Del 2 (teorin om varför en AI skulle 'vilja' skada oss; dokumenterade incidenter och experiment 2016–2026; förklarare och auktoriteter), två för Del 3 (konkreta scenarier och vägar; analogier och framingar), en skeptikeragent som letade upp de starkaste invändningarna, en agent för svensk kontext och ordlista, och en agent för forskning om vilka budskap som faktiskt fungerar på en bred publik."],"bullets":["Varje påstående skulle ha primärkälla med URL och datum. Agenterna markerade det de inte kunde verifiera.","Sökbudgeten tog slut för flera agenter under körningen; de gick då över till att hämta primärkällor direkt (systemkort som PDF, labbens egna inlägg, arXiv, Wikipedia som index)."]},{"title":"Fas 2: Rödlag och debatt","paragraphs":["Tre rödlagsagenter (en per del) läste allt material för sin del plus skeptikerfilen, och angrep varje föreslaget argument: Är det sant? Överdrivet? Vad säger den smartaste skeptikern? Finns en bättre version? De verifierade de mest bärande påståendena mot primärkällor och hittade ett antal fel – bland annat felaktiga IMO-siffror, ett Mythos-citat som inte finns i systemkortet, överdrifter om lösta Erdős-problem, och detaljer i juli 2026-incidenterna som skilde sig från Hugging Faces och OpenAI:s egna redogörelser.","Därefter fick de åtta ursprungliga researcharna rödlagets kritik och svarade punkt för punkt: medge, delvis medge, eller försvara med bevis. De rättade sina filer direkt (markerat med '[corrected after red team]') och lade till en svarstabell. Resultatet: cirka 90 procent av rödlagets faktakorrigeringar medgavs; ett tiotal punkter försvarades framgångsrikt med nya primärkällor (t.ex. att AI 2027-citaten går att verifiera med curl där WebFetch trunkerar sidan)."],"bullets":["Strukna efter debatten: nanoteknik (nämns inte ens), Fudans 'självreplikering' (avfärdas i stället på kamera), Sydney/Bing, det 'dödliga' larmscenariot, gem-maximeraren som rubrik, ett par enskilda uttalanden utan primärkälla.","Nedgraderade: utpressningsrubriken (används bara som upptakt till evaluation awareness), evolutionsanalogin (bild, sedan direkt evidens), Cortés/Pizarro, AI 2027 som förutsägelse (används som märkt scenario med författarnas egen 2026-utvärdering)."]},{"title":"Fas 3: Domare och syntes på svenska","paragraphs":["En domaragent per del läste researchen, kritiken och svaren, bestämde vilka frågor en svensk tittare faktiskt ställer, avgjorde vad som överlevde, och skrev den svenska datan på den här sidan: kärna, manusförslag, för- och nackdelar, bemötande, förbehåll, förklarare, källor och poäng. Tre ytterligare agenter skrev skeptikersektionen, förklararlistan och den svenska kontexten. Orkestratorn granskade konsistens (t.ex. att samma incident beskrivs med samma verifierade siffror i alla delar) och byggde sidan."],"bullets":["Poängen sätts enligt rubriken på översiktssidan: konkret 25 %, robust 25 %, trovärdig 20 %, minnesvärd 15 %, korrekt 15 %. Korrekthet är dessutom en grind: ett påstående som rödlaget visade vara fel är ute eller rättat.","Backfire-listan från kommunikationsforskningen tillämpades: ingen Terminator-/robotbildvärld, inga säkerhetsord ('kommer', 'oundvikligt'), inget eget p(doom), inga fasta datum som egna prognoser, aldrig domedag utan handlingsutrymme."]},{"title":"Vad forskningen om budskap säger (kortversion)","bullets":["Konkreta, daterade exempel slår abstrakta resonemang; berättelse slår statistik (och statistik ovanpå en berättelse kan minska effekten).","Budbärare med insyn och utan ekonomiskt intresse (Hinton, Bengio, avhoppare som Coxon) neutraliserar 'det är marknadsföring'-invändningen bättre än vd-citat.","Rädsla fungerar bara tillsammans med handlingsutrymme (Witte, Tannenbaum); avsluta varje del med vad som går att göra.","Att förekomma invändningar ('men kan man inte bara dra ur sladden?') och medge det skeptikern har rätt i ökar trovärdigheten (inokulering, van der Linden, Roozenbeek).","Existential Risk Observatorys mättester: video slog artikel; kända experter och etablerade medier höjde medvetenheten mest; Yudkowskys TIME-artikel flyttade sannolikhetsbedömningar men var inte mer effektiv än en lugn förklarande text."]},{"title":"Hela materialet","paragraphs":["Det fullständiga researchmaterialet (engelska), rödlagens kritik och researcharnas svar ligger i mappen research/ i samma repo som den här sidan. Datan bakom sidan ligger som JSON i data/ och kan redigeras; kör build.py för att bygga om sidan."],"links":[{"title":"research/ – elva researchfiler (rev 2, med svar till rödlaget)","url":"https://github.com/Snillsparv/doom/tree/claude/pensive-johnson-p4rq0x/research"},{"title":"research/debate/ – rödlagens tre granskningar","url":"https://github.com/Snillsparv/doom/tree/claude/pensive-johnson-p4rq0x/research/debate"},{"title":"data/ – sidans data som JSON","url":"https://github.com/Snillsparv/doom/tree/claude/pensive-johnson-p4rq0x/data"}]},{"title":"Begränsningar att känna till","bullets":["Området rör sig snabbt. Allt är daterat till 15 september 2026; siffror som METR:s tidshorisonter, systemkortens procentsatser och Clay-institutets bedömning av Navier–Stokes-anspråket kan ha ändrats när du spelar in.","Vissa citat är hämtade från nyhetsrapportering snarare än originalinlägg (markerat i researchfilerna). Kontrollera ordalydelsen mot originalet innan du visar ett citat på skärm.","Effektivitetspoängen är bedömningar gjorda av språkmodeller utifrån en rubrik, inte mätningar på riktiga tittare. Testa gärna de tre översta svaren per fråga på några personer i målgruppen.","Sidan är byggd av AI-agenter. Ett antal fel hittades och rättades i debattrundan; det är rimligt att anta att några finns kvar. Källorna finns där för att du ska kunna kontrollera."]}]}};

/* ---------- hjälpare ---------- */
const $ = (s, el=document) => el.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const k of kids.flat(Infinity)){
    if (k==null || k===false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}
const fmt1 = n => (Math.round(n*10)/10).toFixed(1).replace('.', ',');
const TYPE_LABEL = {argument:'Argument', analogi:'Analogi', evidens:'Evidens', exempel:'Exempel', citat:'Citat', scenario:'Scenario'};
const SUB_LABEL = {konkret:'Konkret', robust:'Robust', minnesvard:'Minnesvärd', trovardig:'Trovärdig', korrekt:'Korrekt'};
const SORTS = {
  score:['Effektivitet (sammanvägd)', a=>a.score],
  robust:['Robusthet mot invändningar', a=>(a.scores||{}).robust||0],
  konkret:['Konkretion', a=>(a.scores||{}).konkret||0],
  trovardig:['Trovärdighet', a=>(a.scores||{}).trovardig||0],
  minnesvard:['Minnesvärdhet', a=>(a.scores||{}).minnesvard||0],
  korrekt:['Korrekthet', a=>(a.scores||{}).korrekt||0],
};

let store = {};
try { store = JSON.parse(localStorage.getItem('doom-ui')||'{}') || {}; } catch(e){ store = {}; }

const ui = { sort: store.sort||'score', types: new Set(), open: new Set() };

const ALL_ANSWERS = {};
for (const p of DATA.parts) for (const q of p.questions) for (const a of q.answers) ALL_ANSWERS[a.id] = {a,q,p};

/* ---------- routing ---------- */
function route(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [sec, sub] = hash.split('/');
  const known = ['oversikt','skeptiker','forklarare','svenskt','metod'];
  if (!sec) return {sec:'oversikt'};
  if (known.includes(sec)) return {sec, sub};
  const part = DATA.parts.find(p=>p.id===sec);
  if (part){
    const q = part.questions.find(q=>q.id===sub) || part.questions[0];
    return {sec:'part', part, q};
  }
  return {sec:'oversikt'};
}
window.addEventListener('hashchange', render);

/* ---------- navigering ---------- */
function renderNav(r){
  const rail = $('#rail'); rail.innerHTML='';
  rail.append(h('a',{class:'rail-sec'+(r.sec==='oversikt'?' on':''),href:'#/oversikt'},'Översikt'));
  rail.append(h('div',{class:'rail-div'}));
  DATA.parts.forEach((p,i)=>{
    const on = r.sec==='part' && r.part.id===p.id;
    const wrap = h('div',{class:'rail-part'});
    wrap.append(h('a',{class:'rail-h'+(on?' on':''),href:'#/'+p.id},h('span',{class:'num'},'DEL '+(i+1)),h('span',null,p.title)));
    p.questions.forEach(q=>{
      wrap.append(h('a',{class:'rail-q'+(on&&r.q.id===q.id?' on':''),href:'#/'+p.id+'/'+q.id},q.question,h('span',{class:'cnt'},q.answers.length)));
    });
    rail.append(wrap);
  });
  rail.append(h('div',{class:'rail-div'}));
  [['skeptiker','Skeptikern: invändningar & svar'],['forklarare','Förklarare att låna från'],['svenskt','Svensk kontext & ordlista'],['metod','Metod & källor']].forEach(([id,t])=>{
    rail.append(h('a',{class:'rail-sec'+(r.sec===id?' on':''),href:'#/'+id},t));
  });
  const top = $('#topNav'); top.innerHTML='';
  [['oversikt','Översikt'],...DATA.parts.map((p,i)=>[p.id,'Del '+(i+1)]),['skeptiker','Skeptikern'],['forklarare','Förklarare'],['svenskt','Svenskt'],['metod','Metod']].forEach(([id,t])=>{
    const on = (r.sec===id) || (r.sec==='part' && r.part.id===id);
    top.append(h('a',{class:on?'on':'',href:'#/'+id},t));
  });
}

/* ---------- svarskort ---------- */
function linkList(items){
  if (!items || !items.length) return null;
  return h('ul',{class:'links'}, items.map(s=>h('li',null,
    s.url ? h('a',{href:s.url,target:'_blank',rel:'noopener'},s.name||s.title) : h('span',null,s.name||s.title),
    s.note ? h('span',{class:'note'},s.note) : null)));
}
function answerCard(a, q, p){
  const ref = a.ref ? ALL_ANSWERS[a.ref] : null;
  const src = ref ? ref.a : a;
  const isOpen = ui.open.has(a.id);
  const score = Number(src.score||0);
  const card = h('div',{class:'card'+(isOpen?' open':''),id:'a-'+a.id});
  const head = h('button',{class:'card-head',type:'button','aria-expanded':isOpen?'true':'false',onclick:()=>{ if(ui.open.has(a.id)) ui.open.delete(a.id); else ui.open.add(a.id); card.classList.toggle('open'); head.setAttribute('aria-expanded',card.classList.contains('open')); }},
    h('div',{class:'rank'},String(a.rank)),
    h('div',null,
      h('div',{class:'card-title'},src.title),
      h('div',{class:'card-meta'},
        h('span',{class:'ttag '+(src.type||'argument')},TYPE_LABEL[src.type]||src.type||'Argument'),
        ref ? h('span',{class:'ref-note'},'Fullständig version under: '+ref.q.question) : null,
        a.note && ref ? h('span',{class:'ref-note'},a.note) : null
      )),
    h('div',{class:'score'},
      h('div',{class:'n'},fmt1(score),h('small',null,' /10')),
      h('div',{class:'meter'},h('i',{style:'width:'+Math.max(4,Math.min(100,score*10))+'%'}))),
    h('div',{class:'card-core'+(isOpen?'':' clamp')},src.core),
    h('div',{class:'chev'},isOpen?'Fäll ihop':'Visa allt')
  );
  card.append(head);
  const body = h('div',{class:'card-body'});
  if (ref){
    body.append(h('p',{class:'rebuttal'},'Det här är en korsreferens. Hela underlaget (manusförslag, för- och nackdelar, källor) finns under frågan ',h('a',{href:'#/'+ref.p.id+'/'+ref.q.id},ref.q.question),'.'));
  } else {
    if (a.script) body.append(h('div',{class:'sec'},h('h4',null,'Så kan du säga det'),h('div',{class:'script'},a.script)));
    if (a.quote && a.quote.text) body.append(h('div',{class:'sec'},h('h4',null,'Citat'),h('blockquote',{class:'quote',style:'margin:0'},'“'+a.quote.text+'”',a.quote.original?h('span',{class:'orig'},'“'+a.quote.original+'”'):null,a.quote.who?h('span',{class:'who'},'— '+a.quote.who):null)));
    const cols = h('div',{class:'sec cols'});
    if (a.pros&&a.pros.length) cols.append(h('div',null,h('h4',null,'Fördelar'),h('ul',{class:'pros'},a.pros.map(x=>h('li',null,x)))));
    if (a.cons&&a.cons.length) cols.append(h('div',null,h('h4',null,'Nackdelar & invändningar'),h('ul',{class:'cons'},a.cons.map(x=>h('li',null,x)))));
    if (cols.children.length) body.append(cols);
    if (a.rebuttal) body.append(h('div',{class:'sec'},h('h4',null,'Så bemöter du invändningen'),h('p',{class:'rebuttal'},a.rebuttal)));
    if (a.caveats&&a.caveats.length) body.append(h('div',{class:'sec caveats'},h('h4',null,'Var försiktig med'),h('ul',null,a.caveats.map(x=>h('li',null,x)))));
    if (a.explainers&&a.explainers.length) body.append(h('div',{class:'sec'},h('h4',null,'Vem har förklarat det bra'),linkList(a.explainers)));
    if (a.sources&&a.sources.length) body.append(h('div',{class:'sec'},h('h4',null,'Källor'),linkList(a.sources)));
    if (a.scores) body.append(h('div',{class:'sec subscores'},Object.entries(a.scores).map(([k,v])=>h('span',null,(SUB_LABEL[k]||k)+' ',h('b',null,String(v))))));
    if (a.debate_note) body.append(h('div',{class:'debate'},h('b',null,'Från debattrundan: '),a.debate_note));
  }
  card.append(body);
  return card;
}

/* ---------- vyer ---------- */
function viewPart(r){
  const {part:p, q} = r;
  const c = $('#content'); c.innerHTML='';
  const pi = DATA.parts.indexOf(p);
  const qi = p.questions.indexOf(q);
  c.append(h('div',{class:'qhead'},
    h('div',{class:'eyebrow'},'Del '+(pi+1)+' · '+p.title+' · Fråga '+(qi+1)+' av '+p.questions.length),
    h('h1',null,q.question),
    q.why ? h('p',{class:'why'},q.why) : null));

  const types = [...new Set(q.answers.map(a=>(a.ref?ALL_ANSWERS[a.ref].a.type:a.type)||'argument'))];
  const tb = h('div',{class:'toolbar'});
  const sel = h('select',{id:'sortSel',onchange:e=>{ui.sort=e.target.value;store.sort=ui.sort;save();render();}},
    Object.entries(SORTS).map(([k,[t]])=>h('option',{value:k,selected:ui.sort===k},t)));
  tb.append(h('label',{for:'sortSel'},'Sortera'),sel);
  if (types.length>1){
    tb.append(h('div',{class:'chips'},types.map(t=>h('button',{type:'button',class:'chip'+(ui.types.has(t)?' on':''),onclick:()=>{ui.types.has(t)?ui.types.delete(t):ui.types.add(t);render();}},TYPE_LABEL[t]||t))));
  }
  tb.append(h('span',{class:'spacer'}));
  tb.append(h('button',{type:'button',class:'exp',onclick:()=>{const all=q.answers.every(a=>ui.open.has(a.id)); q.answers.forEach(a=>all?ui.open.delete(a.id):ui.open.add(a.id)); render();}},
    q.answers.every(a=>ui.open.has(a.id))?'Fäll ihop alla':'Visa alla'));
  c.append(tb);

  let list = q.answers.slice();
  if (ui.types.size) list = list.filter(a=>ui.types.has((a.ref?ALL_ANSWERS[a.ref].a.type:a.type)||'argument'));
  const key = SORTS[ui.sort][1];
  list.sort((x,y)=>{const ax=x.ref?ALL_ANSWERS[x.ref].a:x, ay=y.ref?ALL_ANSWERS[y.ref].a:y; return key(ay)-key(ax) || x.rank-y.rank;});
  const wrap = h('div',{class:'answers'});
  if (!list.length) wrap.append(h('p',{class:'empty'},'Inga svar matchar filtret.'));
  list.forEach(a=>wrap.append(answerCard(a,q,p)));
  c.append(wrap);

  const prev = qi>0 ? {p, q:p.questions[qi-1]} : (pi>0 ? {p:DATA.parts[pi-1], q:DATA.parts[pi-1].questions.at(-1)} : null);
  const next = qi<p.questions.length-1 ? {p, q:p.questions[qi+1]} : (pi<DATA.parts.length-1 ? {p:DATA.parts[pi+1], q:DATA.parts[pi+1].questions[0]} : null);
  c.append(h('div',{class:'qnav'},
    prev ? h('a',{href:'#/'+prev.p.id+'/'+prev.q.id},h('span',{class:'lbl'},'← Föregående'),prev.q.question) : h('span'),
    next ? h('a',{href:'#/'+next.p.id+'/'+next.q.id,style:'text-align:right'},h('span',{class:'lbl'},'Nästa →'),next.q.question) : h('span')));
}

        ['Korrekt','15 %','Sant och inte överdrivet; en faktakoll hittar inget.'],
      ].map(r=>h('tr',null,h('td',null,r[0]),h('td',{class:'w'},r[1]),h('td',null,r[2])))))));
  c.append(rub);
  if (m.how_to_use) c.append(h('div',{class:'block'},h('h2',null,'Så använder du sidan'),...m.how_to_use.map(t=>h('p',null,t))));
  c.append(h('p',{class:'foot'},m.footer||''));
}

function viewObjections(){
  const c = $('#content'); c.innerHTML='';
  const items = DATA.objections.items||[];
  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'Tvärgående'),h('h1',null,'Skeptikern: de starkaste invändningarna och hur du svarar'),
    h('p',{class:'why'},DATA.objections.intro||'Varje invändning i sin starkaste form, det bästa ärliga svaret, och en ärlig bedömning av var skeptikern faktiskt har en poäng. Överdriv aldrig – ett enda överdrivet påstående kan sänka hela serien.')));
  const parts = [...new Set(items.map(o=>o.part))];
  ui.objPart = ui.objPart||'alla';
  c.append(h('div',{class:'filterrow'},[['alla','Alla'],...parts.map(p=>[p,OBJ_PART[p]||p])].map(([k,t])=>h('button',{type:'button',class:'chip'+(ui.objPart===k?' on':''),onclick:()=>{ui.objPart=k;render();}},t))));
  const list = h('div',{class:'list'});
  items.filter(o=>ui.objPart==='alla'||o.part===ui.objPart).forEach(o=>{
    const open = ui.open.has(o.id);
    const el = h('div',{class:'obj'+(open?' open':'')});
    const head = h('button',{class:'obj-head',type:'button','aria-expanded':open?'true':'false',onclick:()=>{ui.open.has(o.id)?ui.open.delete(o.id):ui.open.add(o.id);el.classList.toggle('open');head.setAttribute('aria-expanded',el.classList.contains('open'));}},
      h('div',null,h('div',{class:'t'},'”'+o.objection+'”'),h('div',{class:'who'},[o.who,OBJ_PART[o.part]].filter(Boolean).join(' · '))),
      h('span',{class:'verdict '+(o.verdict_class||'delvis')},o.verdict_label||'Delvis'));
    el.append(head);
    const b = h('div',{class:'obj-body'});
    if (o.strongest) b.append(h('div',{class:'sec'},h('h4',null,'Invändningen i sin starkaste form'),h('div',{class:'strong'},o.strongest)));
    if (o.rebuttal) b.append(h('div',{class:'sec'},h('h4',null,'Bästa svaret'),h('p',{class:'rebuttal'},o.rebuttal)));
    if (o.video_response) b.append(h('div',{class:'sec'},h('h4',null,'Så kan du säga det på 20 sekunder'),h('div',{class:'script'},o.video_response)));
    if (o.verdict) b.append(h('div',{class:'sec'},h('h4',null,'Ärlig bedömning'),h('p',{class:'rebuttal'},o.verdict)));
    if (o.concede) b.append(h('div',{class:'sec caveats'},h('h4',null,'Här har skeptikern en poäng'),h('p',null,o.concede)));
    if (o.related&&o.related.length) b.append(h('div',{class:'sec'},h('h4',null,'Relaterade svar i banken'),h('ul',{class:'links'},o.related.map(id=>{const x=ALL_ANSWERS[id];return x?h('li',null,h('a',{href:'#/'+x.p.id+'/'+x.q.id},x.a.title),h('span',{class:'note'},x.q.question)):null;}))));
    if (o.sources&&o.sources.length) b.append(h('div',{class:'sec'},h('h4',null,'Källor'),linkList(o.sources)));
    el.append(b); list.append(el);
  });
  c.append(list);
}
const OBJ_PART = {del1:'Del 1: Hur AI fungerar',del2:'Del 2: Varför skulle AI vilja det',del3:'Del 3: Hur det kan gå till',meta:'Övergripande'};

function viewExplainers(){
  const c = $('#content'); c.innerHTML='';
  const E = DATA.explainers;
  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'Låna av de bästa'),h('h1',null,'Förklarare som har lyckats'),h('p',{class:'why'},E.intro||'')));
  const groups = E.groups||[{title:'',items:E.items||[]}];
  groups.forEach(g=>{
    if (g.title) c.append(h('h2',{class:'h2'},g.title));
    c.append(h('div',{class:'list'},(g.items||[]).map(x=>h('div',{class:'item'},
      h('div',{class:'t'},x.url?h('a',{href:x.url,target:'_blank',rel:'noopener'},x.name):x.name),
      h('div',{class:'m'},[x.who,x.format,x.year].filter(Boolean).join(' · ')),
      x.what?h('p',null,x.what):null,
      x.borrow?h('div',{class:'borrow'},h('b',null,'Värt att låna'),x.borrow):null,
      x.weakness?h('p',{style:'color:var(--muted)'},'Svaghet: '+x.weakness):null))));
  });
}

function viewSwedish(){
  const c = $('#content'); c.innerHTML='';
  const S = DATA.swedish||{};
  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'För en svensk publik'),h('h1',null,S.title||'Svensk kontext, röster och ordlista'),h('p',{class:'why'},S.intro||'')));
  (S.sections||[]).forEach(sec=>{
    c.append(h('h2',{class:'h2'},sec.title));
    if (sec.text) c.append(h('p',{style:'max-width:72ch;margin-bottom:12px'},sec.text));
    if (sec.items) c.append(h('div',{class:'list'},sec.items.map(x=>h('div',{class:'item'},
      h('div',{class:'t'},x.url?h('a',{href:x.url,target:'_blank',rel:'noopener'},x.name):x.name),
      x.meta?h('div',{class:'m'},x.meta):null,
      x.text?h('p',null,x.text):null,
      x.borrow?h('div',{class:'borrow'},h('b',null,'Användbart'),x.borrow):null))));
    if (sec.glossary) c.append(h('div',{class:'tablewrap'},h('table',{class:'gloss'},
      h('thead',null,h('tr',null,h('th',null,'Engelska'),h('th',null,'Svenska (rekommenderat)'),h('th',null,'Kommentar'))),
      h('tbody',null,sec.glossary.map(g=>h('tr',null,h('td',null,g.en),h('td',null,g.sv),h('td',null,g.note||'')))))));
  });
}

function viewMethod(){
  const c = $('#content'); c.innerHTML='';
  const M = DATA.method||{};
  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'Bakom kulisserna'),h('h1',null,'Så gjordes researchen'),h('p',{class:'why'},M.intro||'')));
  (M.sections||[]).forEach(sec=>{
    const b = h('div',{class:'block',style:'margin-top:22px'},h('h2',null,sec.title));
    (sec.paragraphs||[]).forEach(t=>b.append(h('p',null,t)));
    if (sec.bullets) b.append(h('ul',{style:'margin-top:8px'},sec.bullets.map(t=>h('li',null,t))));
    if (sec.links) b.append(h('div',{style:'margin-top:8px'},linkList(sec.links)));
    c.append(b);
  });
}

function render(){
  const r = route();
  renderNav(r);
  $('#rail').classList.remove('show'); $('#menuBtn').setAttribute('aria-expanded','false');
  if (r.sec==='part') viewPart(r);
  else if (r.sec==='skeptiker') viewObjections();
  else if (r.sec==='forklarare') viewExplainers();
  else if (r.sec==='svenskt') viewSwedish();
  else if (r.sec==='metod') viewMethod();
  else viewOverview();
  window.scrollTo({top:0});
}
$('#menuBtn').addEventListener('click',()=>{const r=$('#rail');r.classList.toggle('show');$('#menuBtn').setAttribute('aria-expanded',r.classList.contains('show'));});
render();
</script>
