function linkList(items){
  if (!items || !items.length) return null;
  return h('ul',{class:'links'}, items.map(s=>h('li',null,
    s.url ? h('a',{href:s.url,target:'_blank',rel:'noopener'},s.name||s.title) : h('span',null,s.name||s.title),
    s.note ? h('span',{class:'note'},s.note) : null)));
}
function answerCard(a, q, p){
  const ref = a.ref ? ALL_ANSWERS[a.ref] : null;
  const src = ref ? ref.a : a;
  const isOpen = ui.open.has(a.id);
  const score = Number(src.score||0);
  const card = h('div',{class:'card'+(isOpen?' open':''),id:'a-'+a.id});
  const head = h('button',{class:'card-head',type:'button','aria-expanded':isOpen?'true':'false',onclick:()=>{ if(ui.open.has(a.id)) ui.open.delete(a.id); else ui.open.add(a.id); card.classList.toggle('open'); head.setAttribute('aria-expanded',card.classList.contains('open')); }},
    h('div',{class:'rank'},String(a.rank)),
    h('div',null,
      h('div',{class:'card-title'},src.title),
      h('div',{class:'card-meta'},
        h('span',{class:'ttag '+(src.type||'argument')},TYPE_LABEL[src.type]||src.type||'Argument'),
        ref ? h('span',{class:'ref-note'},'Fullständig version under: '+ref.q.question) : null,
        a.note && ref ? h('span',{class:'ref-note'},a.note) : null
      )),
    h('div',{class:'score'},
      h('div',{class:'n'},fmt1(score),h('small',null,' /10')),
      h('div',{class:'meter'},h('i',{style:'width:'+Math.max(4,Math.min(100,score*10))+'%'}))),
    h('div',{class:'card-core'+(isOpen?'':' clamp')},src.core),
    h('div',{class:'chev'},isOpen?'Fäll ihop':'Visa allt')
  );
  card.append(head);
  const body = h('div',{class:'card-body'});
  if (ref){
    body.append(h('p',{class:'rebuttal'},'Det här är en korsreferens. Hela underlaget (manusförslag, för- och nackdelar, källor) finns under frågan ',h('a',{href:'#/'+ref.p.id+'/'+ref.q.id},ref.q.question),'.'));
  } else {
    if (a.script) body.append(h('div',{class:'sec'},h('h4',null,'Så kan du säga det'),h('div',{class:'script'},a.script)));
    if (a.quote && a.quote.text) body.append(h('div',{class:'sec'},h('h4',null,'Citat'),h('blockquote',{class:'quote',style:'margin:0'},'“'+a.quote.text+'”',a.quote.original?h('span',{class:'orig'},'“'+a.quote.original+'”'):null,a.quote.who?h('span',{class:'who'},'— '+a.quote.who):null)));
    const cols = h('div',{class:'sec cols'});
    if (a.pros&&a.pros.length) cols.append(h('div',null,h('h4',null,'Fördelar'),h('ul',{class:'pros'},a.pros.map(x=>h('li',null,x)))));
    if (a.cons&&a.cons.length) cols.append(h('div',null,h('h4',null,'Nackdelar & invändningar'),h('ul',{class:'cons'},a.cons.map(x=>h('li',null,x)))));
    if (cols.children.length) body.append(cols);
    if (a.rebuttal) body.append(h('div',{class:'sec'},h('h4',null,'Så bemöter du invändningen'),h('p',{class:'rebuttal'},a.rebuttal)));
    if (a.caveats&&a.caveats.length) body.append(h('div',{class:'sec caveats'},h('h4',null,'Var försiktig med'),h('ul',null,a.caveats.map(x=>h('li',null,x)))));
    if (a.explainers&&a.explainers.length) body.append(h('div',{class:'sec'},h('h4',null,'Vem har förklarat det bra'),linkList(a.explainers)));
    if (a.sources&&a.sources.length) body.append(h('div',{class:'sec'},h('h4',null,'Källor'),linkList(a.sources)));
    if (a.scores) body.append(h('div',{class:'sec subscores'},Object.entries(a.scores).map(([k,v])=>h('span',null,(SUB_LABEL[k]||k)+' ',h('b',null,String(v))))));
    if (a.debate_note) body.append(h('div',{class:'debate'},h('b',null,'Från debattrundan: '),a.debate_note));
  }
  card.append(body);
  return card;
}

/* ---------- vyer ---------- */
function viewPart(r){
  const {part:p, q} = r;
  const c = $('#content'); c.innerHTML='';
  const pi = DATA.parts.indexOf(p);
  const qi = p.questions.indexOf(q);
  c.append(h('div',{class:'qhead'},
    h('div',{class:'eyebrow'},'Del '+(pi+1)+' · '+p.title+' · Fråga '+(qi+1)+' av '+p.questions.length),
    h('h1',null,q.question),
    q.why ? h('p',{class:'why'},q.why) : null));

  const types = [...new Set(q.answers.map(a=>(a.ref?ALL_ANSWERS[a.ref].a.type:a.type)||'argument'))];
  const tb = h('div',{class:'toolbar'});
  const sel = h('select',{id:'sortSel',onchange:e=>{ui.sort=e.target.value;store.sort=ui.sort;save();render();}},
    Object.entries(SORTS).map(([k,[t]])=>h('option',{value:k,selected:ui.sort===k},t)));
  tb.append(h('label',{for:'sortSel'},'Sortera'),sel);
  if (types.length>1){
    tb.append(h('div',{class:'chips'},types.map(t=>h('button',{type:'button',class:'chip'+(ui.types.has(t)?' on':''),onclick:()=>{ui.types.has(t)?ui.types.delete(t):ui.types.add(t);render();}},TYPE_LABEL[t]||t))));
  }
  tb.append(h('span',{class:'spacer'}));
  tb.append(h('button',{type:'button',class:'exp',onclick:()=>{const all=q.answers.every(a=>ui.open.has(a.id)); q.answers.forEach(a=>all?ui.open.delete(a.id):ui.open.add(a.id)); render();}},
    q.answers.every(a=>ui.open.has(a.id))?'Fäll ihop alla':'Visa alla'));
  c.append(tb);

  let list = q.answers.slice();
  if (ui.types.size) list = list.filter(a=>ui.types.has((a.ref?ALL_ANSWERS[a.ref].a.type:a.type)||'argument'));
  const key = SORTS[ui.sort][1];
  list.sort((x,y)=>{const ax=x.ref?ALL_ANSWERS[x.ref].a:x, ay=y.ref?ALL_ANSWERS[y.ref].a:y; return key(ay)-key(ax) || x.rank-y.rank;});
  const wrap = h('div',{class:'answers'});
  if (!list.length) wrap.append(h('p',{class:'empty'},'Inga svar matchar filtret.'));
  list.forEach(a=>wrap.append(answerCard(a,q,p)));
  c.append(wrap);

  const prev = qi>0 ? {p, q:p.questions[qi-1]} : (pi>0 ? {p:DATA.parts[pi-1], q:DATA.parts[pi-1].questions.at(-1)} : null);
  const next = qi<p.questions.length-1 ? {p, q:p.questions[qi+1]} : (pi<DATA.parts.length-1 ? {p:DATA.parts[pi+1], q:DATA.parts[pi+1].questions[0]} : null);
  c.append(h('div',{class:'qnav'},
    prev ? h('a',{href:'#/'+prev.p.id+'/'+prev.q.id},h('span',{class:'lbl'},'← Föregående'),prev.q.question) : h('span'),
    next ? h('a',{href:'#/'+next.p.id+'/'+next.q.id,style:'text-align:right'},h('span',{class:'lbl'},'Nästa →'),next.q.question) : h('span')));
}

function viewOverview(){
  const c = $('#content'); c.innerHTML='';
  const nA = Object.keys(ALL_ANSWERS).length;
  const nQ = DATA.parts.reduce((s,p)=>s+p.questions.length,0);
  const nO = (DATA.objections.items||[]).length;
  const nS = new Set(Object.values(ALL_ANSWERS).flatMap(({a})=>(a.sources||[]).map(s=>s.url))).size;
  const m = DATA.method||{};
  c.append(h('div',{class:'hero'},
    h('div',{class:'eyebrow'},'Researchunderlag för en videoserie i tre delar'),
    h('h1',null,'Hur skulle AI kunna döda alla människor?'),
    h('p',{class:'lede'},m.lede||'Alla argument, analogier, exempel och bevis som hittats, sorterade efter hur effektiva de sannolikt är för en tittare utan förkunskaper. Varje svar har fördelar, nackdelar, manusförslag och källor.'),
    h('div',{class:'stats'},
      h('span',null,h('b',null,String(nQ)),' frågor'),
      h('span',null,h('b',null,String(nA)),' svar'),
      h('span',null,h('b',null,String(nO)),' skeptikerinvändningar'),
      h('span',null,h('b',null,String(nS)),' källor'),
      h('span',null,h('b',null,m.agents||'–'),' agenter i research & debatt'))));

  c.append(h('div',{class:'grid3'},DATA.parts.map((p,i)=>{
    const top = Object.values(ALL_ANSWERS).filter(x=>x.p===p&&!x.a.ref).sort((x,y)=>y.a.score-x.a.score).slice(0,3);
    return h('div',{class:'pcard'},
      h('div',{class:'num'},'DEL '+(i+1)),
      h('h3',null,p.title),
      h('p',null,p.subtitle||''),
      h('div',null,h('div',{class:'eyebrow',style:'margin-bottom:6px'},'Starkast enligt rankingen'),h('ol',null,top.map(({a,q})=>h('li',null,h('a',{href:'#/'+p.id+'/'+q.id},a.title),' ',h('span',{class:'mono',style:'font-size:11px;color:var(--muted)'},fmt1(a.score)))))),
      h('a',{class:'go',href:'#/'+p.id},'Bläddra bland '+p.questions.length+' frågor →'));
  })));

  DATA.parts.forEach((p,i)=>{
    if (!p.recommended_spine||!p.recommended_spine.length) return;
    c.append(h('div',{class:'block'},h('h2',null,'Rekommenderad dramaturgi, del '+(i+1)+': '+p.title),
      p.intro?h('p',{style:'color:var(--muted);margin-bottom:10px'},p.intro):null,
      h('ol',{class:'spine'},p.recommended_spine.map(s=>h('li',null,s)))));
  });

  const rub = h('div',{class:'block'},h('h2',null,'Så är svaren rankade'),
    h('p',null,m.rubric_intro||'Varje svar har fått 1–10 på fem kriterier. Vikterna bygger på vad forskning om riskkommunikation och de bästa förklararnas erfarenhet säger fungerar. Sammanvägningen är en bedömning, inte en mätning – använd den som utgångspunkt, inte facit.'),
    h('div',{class:'tablewrap'},h('table',{class:'rubric'},
      h('thead',null,h('tr',null,h('th',null,'Kriterium'),h('th',null,'Vikt'),h('th',null,'Vad det mäter'))),
      h('tbody',null,[
        ['Konkret','25 %','Greppbart utan förkunskaper; ger en bild i huvudet.'],
        ['Robust','25 %','Överlever den bästa skeptikerinvändningen.'],
        ['Trovärdig','20 %','Stöds av trovärdiga budbärare och primärkällor, inte bara "domedagsprofeter".'],
        ['Minnesvärd','15 %','Går att återberätta för en kompis dagen efter.'],
        ['Korrekt','15 %','Sant och inte överdrivet; en faktakoll hittar inget.'],
      ].map(r=>h('tr',null,h('td',null,r[0]),h('td',{class:'w'},r[1]),h('td',null,r[2])))))));
  c.append(rub);
  if (m.how_to_use) c.append(h('div',{class:'block'},h('h2',null,'Så använder du sidan'),...m.how_to_use.map(t=>h('p',null,t))));
  c.append(h('p',{class:'foot'},m.footer||''));
}

function viewObjections(){
  const c = $('#content'); c.innerHTML='';
  const items = DATA.objections.items||[];
  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'Tvärgående'),h('h1',null,'Skeptikern: de starkaste invändningarna och hur du svarar'),
    h('p',{class:'why'},DATA.objections.intro||'Varje invändning i sin starkaste form, det bästa ärliga svaret, och en ärlig bedömning av var skeptikern faktiskt har en poäng. Överdriv aldrig – ett enda överdrivet påstående kan sänka hela serien.')));
  const parts = [...new Set(items.map(o=>o.part))];
  ui.objPart = ui.objPart||'alla';
  c.append(h('div',{class:'filterrow'},[['alla','Alla'],...parts.map(p=>[p,OBJ_PART[p]||p])].map(([k,t])=>h('button',{type:'button',class:'chip'+(ui.objPart===k?' on':''),onclick:()=>{ui.objPart=k;render();}},t))));
  const list = h('div',{class:'list'});
  items.filter(o=>ui.objPart==='alla'||o.part===ui.objPart).forEach(o=>{
    const open = ui.open.has(o.id);
    const el = h('div',{class:'obj'+(open?' open':'')});
    const head = h('button',{class:'obj-head',type:'button','aria-expanded':open?'true':'false',onclick:()=>{ui.open.has(o.id)?ui.open.delete(o.id):ui.open.add(o.id);el.classList.toggle('open');head.setAttribute('aria-expanded',el.classList.contains('open'));}},
      h('div',null,h('div',{class:'t'},'”'+o.objection+'”'),h('div',{class:'who'},[o.who,OBJ_PART[o.part]].filter(Boolean).join(' · '))),
      h('span',{class:'verdict '+(o.verdict_class||'delvis')},o.verdict_label||'Delvis'));
    el.append(head);
    const b = h('div',{class:'obj-body'});
    if (o.strongest) b.append(h('div',{class:'sec'},h('h4',null,'Invändningen i sin starkaste form'),h('div',{class:'strong'},o.strongest)));
    if (o.rebuttal) b.append(h('div',{class:'sec'},h('h4',null,'Bästa svaret'),h('p',{class:'rebuttal'},o.rebuttal)));
    if (o.video_response) b.append(h('div',{class:'sec'},h('h4',null,'Så kan du säga det på 20 sekunder'),h('div',{class:'script'},o.video_response)));
    if (o.verdict) b.append(h('div',{class:'sec'},h('h4',null,'Ärlig bedömning'),h('p',{class:'rebuttal'},o.verdict)));
    if (o.concede) b.append(h('div',{class:'sec caveats'},h('h4',null,'Här har skeptikern en poäng'),h('p',null,o.concede)));
    if (o.related&&o.related.length) b.append(h('div',{class:'sec'},h('h4',null,'Relaterade svar i banken'),h('ul',{class:'links'},o.related.map(id=>{const x=ALL_ANSWERS[id];return x?h('li',null,h('a',{href:'#/'+x.p.id+'/'+x.q.id},x.a.title),h('span',{class:'note'},x.q.question)):null;}))));
    if (o.sources&&o.sources.length) b.append(h('div',{class:'sec'},h('h4',null,'Källor'),linkList(o.sources)));
    el.append(b); list.append(el);
  });
  c.append(list);
}
const OBJ_PART = {del1:'Del 1: Hur AI fungerar',del2:'Del 2: Varför skulle AI vilja det',del3:'Del 3: Hur det kan gå till',meta:'Övergripande'};

function viewExplainers(){
  const c = $('#content'); c.innerHTML='';
  const E = DATA.explainers;
  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'Låna av de bästa'),h('h1',null,'Förklarare som har lyckats'),h('p',{class:'why'},E.intro||'')));
  const groups = E.groups||[{title:'',items:E.items||[]}];
  groups.forEach(g=>{
    if (g.title) c.append(h('h2',{class:'h2'},g.title));
    c.append(h('div',{class:'list'},(g.items||[]).map(x=>h('div',{class:'item'},
      h('div',{class:'t'},x.url?h('a',{href:x.url,target:'_blank',rel:'noopener'},x.name):x.name),
      h('div',{class:'m'},[x.who,x.format,x.year].filter(Boolean).join(' · ')),
      x.what?h('p',null,x.what):null,
      x.borrow?h('div',{class:'borrow'},h('b',null,'Värt att låna'),x.borrow):null,
      x.weakness?h('p',{style:'color:var(--muted)'},'Svaghet: '+x.weakness):null))));
  });
}

  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'För en svensk publik'),h('h1',null,S.title||'Svensk kontext, röster och ordlista'),h('p',{class:'why'},S.intro||'')));
  (S.sections||[]).forEach(sec=>{
    c.append(h('h2',{class:'h2'},sec.title));
    if (sec.text) c.append(h('p',{style:'max-width:72ch;margin-bottom:12px'},sec.text));
    if (sec.items) c.append(h('div',{class:'list'},sec.items.map(x=>h('div',{class:'item'},
      h('div',{class:'t'},x.url?h('a',{href:x.url,target:'_blank',rel:'noopener'},x.name):x.name),
      x.meta?h('div',{class:'m'},x.meta):null,
      x.text?h('p',null,x.text):null,
      x.borrow?h('div',{class:'borrow'},h('b',null,'Användbart'),x.borrow):null))));
    if (sec.glossary) c.append(h('div',{class:'tablewrap'},h('table',{class:'gloss'},
      h('thead',null,h('tr',null,h('th',null,'Engelska'),h('th',null,'Svenska (rekommenderat)'),h('th',null,'Kommentar'))),
      h('tbody',null,sec.glossary.map(g=>h('tr',null,h('td',null,g.en),h('td',null,g.sv),h('td',null,g.note||'')))))));
  });
}

function viewMethod(){
  const c = $('#content'); c.innerHTML='';
  const M = DATA.method||{};
  c.append(h('div',{class:'qhead'},h('div',{class:'eyebrow'},'Bakom kulisserna'),h('h1',null,'Så gjordes researchen'),h('p',{class:'why'},M.intro||'')));
  (M.sections||[]).forEach(sec=>{
    const b = h('div',{class:'block',style:'margin-top:22px'},h('h2',null,sec.title));
    (sec.paragraphs||[]).forEach(t=>b.append(h('p',null,t)));
    if (sec.bullets) b.append(h('ul',{style:'margin-top:8px'},sec.bullets.map(t=>h('li',null,t))));
    if (sec.links) b.append(h('div',{style:'margin-top:8px'},linkList(sec.links)));
    c.append(b);
  });
}

function render(){
  const r = route();
  renderNav(r);
  $('#rail').classList.remove('show'); $('#menuBtn').setAttribute('aria-expanded','false');
  if (r.sec==='part') viewPart(r);
  else if (r.sec==='skeptiker') viewObjections();
  else if (r.sec==='forklarare') viewExplainers();
  else if (r.sec==='svenskt') viewSwedish();
  else if (r.sec==='metod') viewMethod();
  else viewOverview();
  window.scrollTo({top:0});
}
$('#menuBtn').addEventListener('click',()=>{const r=$('#rail');r.classList.toggle('show');$('#menuBtn').setAttribute('aria-expanded',r.classList.contains('show'));});
render();
